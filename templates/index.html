        const EXPRESSION_ALIASES = {
            '무표정': 'neutral',
            '슬퍼': 'sorrow',
            '기뻐': 'joy',
            '웃음': 'joy',
            '미소': 'fun',
            '재밌': 'joy',
        };


        function expressionList() {
            // 명령으로 지을 수 있는 표정만. 윙크나 눈 감기는 눈 상태다.
            return ((ENTITY && ENTITY.expressions) || [])
                .filter(e => e.is_reply_emotion !== false);
        }


        function expressionWords() {
            return expressionList().map(e => e.label);
        }


              function handleExpressionCommand(text) {

            if (
                !text.startsWith('/표정')
            ) {

                return false;
            }


            const command =
                text
                    .replace('/표정', '')
                    .trim()
                    .toLowerCase();


            // 표정 이름은 개체가 가지고 있다(기쁨·즐거움·슬픔·화남·놀람·평온).
            // 여기서 따로 이름을 들고 있으면 개체가 이름을 바꿔도 모르고,
            // 실제로 '미소'·'웃음'처럼 어긋난 이름이 남아 있었다.
            const expressionMap = {};
            const expressionNames = {};

            expressionList().forEach(e => {
                expressionMap[e.key] = e.key;
                expressionMap[String(e.label).toLowerCase()] = e.key;
                expressionNames[e.key] = e.label;
            });

            // 개체의 이름 말고도 흔히 쓰는 말 몇 개를 더 받는다
            Object.keys(EXPRESSION_ALIASES).forEach(word => {
                const key = EXPRESSION_ALIASES[word];
                if (expressionNames[key]) expressionMap[word] = key;
            });

            const expression =
                expressionMap[command];


            if (!expression) {

                appendMessage(
                    'ai',
                    '지을 수 있는 표정은 ' + expressionWords().join(', ') + ' 이야.'
                );

                return true;
            }


            wakeUp();

            resetTimers();

            stopLipSync();


            // 해당 고유 표정을 얼굴에 즉시 장착합니다.
            applyExpression(
                expression
            );


            // 화면에 깔끔하게 테스트 피드백 로그를 찍어줍니다.
            appendMessage(
                'ai',
                `표정 테스트: ${expressionNames[expression]}`
            );


            speechBubble.innerText =
                `표정 테스트: ${expressionNames[expression]}`;

            speechBubble.style.display =
                'block';


            if (bubbleHideTimer) {

                clearTimeout(
                    bubbleHideTimer
                );
            }

            if (window.expressionChangeTimer) {

                clearTimeout(
                    window.expressionChangeTimer
                );
            }


            // 🚀 [유저님의 최종 공식] 놀람은 딱 1초(1000ms), 그 외 모든 감정은 3초(3000ms) 유지 후 무표정 복귀!
            const duration =
                (expression === 'surprised')
                    ? 500
                    : 3000;


            window.expressionChangeTimer =
                setTimeout(() => {

                    applyExpression(
                        'neutral'
                    );

                }, duration);


            // 말풍선도 3초 뒤에 깔끔하게 닫히도록 맞춰줍니다.
            bubbleHideTimer =
                setTimeout(() => {

                    speechBubble.style.display =
                        'none';

                }, 3000);


            return true;
        }

        function clearChatLog() {

                    // 너무 많으면 화면이 무거워진다. 최근 것만 보인다.
                    list.slice(-60).forEach(m => {

                        appendMessage(m.role === 'user' ? 'user' : 'ai',

        async function runMemoryCommand(archive) {

                ? '/api/memory/archive'
                : '/api/memory/restore';

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'

                const d = await res.json();

                if (!d.ok) {

                        + `/리셋 으로 되찾을 수 있습니다.`);

        function handleAffinityCommand(text) {

        async function runAffinityReset(value) {

            try {
                const res = await fetch('/api/relationship/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(
                        value === null ? {} : { affinity: value })

                const d = await res.json();

                if (!d.ok) {

                appendMessage('ai',
                    '호감도 ' + d.before + ' → ' + d.affinity
                    + ' (' + d.stage_label + ')'
                    + (d.devotion_cleared
                        ? ' · 쌓였던 순종 ' + d.devotion_cleared + '점도 비웠습니다'
                        : ''));

                // 사이가 통째로 바뀌었다. 눈금과 잠긴 도구를 다시 맞춘다.
                myAffinity = d.affinity;

            } catch (e) {

        // 절정 다섯 번을 손으로 채우지 않고도 배가 부른 모습을 봐야

        function handleChildCommand(text) {
            const t = text.replace(/\s+/g, '');

            if (t === '/아이' || t === '/임신상태') {
                appendMessage('user', text);
                childState(null);
                return true;
            }

            if (t === '/임신') {
                appendMessage('user', text);
                childState({ wants_child: true, pregnant: true, strokes: 0 },
                            '아이가 섰습니다.');
                return true;
            }

            if (t === '/임신취소' || t === '/임신해제') {
                appendMessage('user', text);
                childState({ pregnant: false, climax: 0, strokes: 0 },
                            '되돌렸습니다.');
                return true;
            }

            if (t === '/약속') {
                appendMessage('user', text);
                childState({ wants_child: true }, '아이를 갖기로 한 것으로 둡니다.');
                return true;
            }

            let m = t.match(/^\/절정(-?\d+)$/);
            if (m) {
                appendMessage('user', text);
                childState({ climax: parseInt(m[1], 10), strokes: 0 });
                return true;
            }

            m = t.match(/^\/순종(-?\d+)$/);
            if (m) {
                appendMessage('user', text);
                childState({ devotion: parseInt(m[1], 10) });
                return true;
            }

            if (t === '/배') {
                appendMessage('user', text);
                toggleBellyPanel();
                return true;
            }

            return false;
        }


        async function childState(patch, note) {
            try {
                const res = await fetch('/api/child', {
                    method: patch ? 'POST' : 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    body: patch ? JSON.stringify(patch) : undefined,
                });
                const d = await res.json();

                if (!d.ok) {
                    appendMessage('ai', d.error || '맞추지 못했습니다.');
                    return;
                }

                setPregnant(d.pregnant, false);

                myDevotion.level = d.devotion;
                myDevotion.raw = d.devotion_raw;

                appendMessage('ai',
                    (note ? note + '\n\n' : '')
                    + '단계     ' + (d.stage || '?')
                    + '  (아이 이야기는 ' + d.need_stage + ' 부터)\n'
                    + '순종     ' + d.devotion + ' / ' + d.need_devotion + '\n'
                    + '약속     ' + (d.wants_child ? '했다' : '아직')  + '\n'
                    + '절정     ' + d.climax + ' / ' + d.need_climax + '\n'
                    + '쌓인 것  ' + d.strokes + ' / ' + d.need_strokes + '\n'
                    + '배       ' + (d.pregnant ? '불렀다' : '아직'));

            } catch (e) {
                console.warn('[diamondAI] 아이 상태 실패:', e);
                appendMessage('ai', '맞추지 못했습니다.');
            }
        }

        let bellyPanel = null;

        function toggleBellyPanel() {
            if (bellyPanel) {

            const p = pregCfg() || {};

                'border-radius:12px;padding:12px 13px;color:#dfe1f0;' +
                'font-size:0.8rem;font-family:inherit;user-select:none';

            const axes = [
                ['가로', 0, 1.0, 2.2],
                ['위아래', 1, 0.8, 1.4],
                ['앞뒤', 2, 1.0, 2.4],
            ];

            let html = '<b>배 — spine 배율</b>'
                + '<div style="opacity:.6;margin:3px 0 9px">'
                + 'chest 는 역수로 되돌려 위쪽 몸은 그대로 둔다</div>';

            axes.forEach(([label, i, lo, hi]) => {
                html += '<div style="margin:7px 0 2px">' + label
                    + ' <span id="bv' + i + '">' + cur[i].toFixed(2)
                    + '</span></div>'
                    + '<input type="range" id="bs' + i + '" style="width:100%"'
                    + ' min="' + lo + '" max="' + hi + '" step="0.01"'
                    + ' value="' + cur[i] + '">';
            });

            html += '<div style="margin:9px 0 2px">부른 정도'
                + ' <span id="bvk">1.00</span></div>'
                + '<input type="range" id="bsk" style="width:100%"'

                + 'border:1px solid #7a68b0;color:#dfe1f0;cursor:pointer;'

                + '<div style="opacity:.6;margin-top:7px">/배 로 닫는다</div>';

            bellyPanel.innerHTML = html;
            document.body.appendChild(bellyPanel);

            bellyOverride = cur;
            bellyNow = 1;
            bellyWant = 1;

            const push = () => {
                axes.forEach(([, i]) => {
                    const v = parseFloat(
                        document.getElementById('bs' + i).value);
                    cur[i] = v;
                    document.getElementById('bv' + i).textContent = v.toFixed(2);
                });
                bellyOverride = cur.slice();

            axes.forEach(([, i]) => {
                document.getElementById('bs' + i)
                    .addEventListener('input', push);

            document.getElementById('bsk').addEventListener('input', (e) => {
                const k = parseFloat(e.target.value);
                document.getElementById('bvk').textContent = k.toFixed(2);
                bellyNow = k;
                bellyWant = k;

            document.getElementById('bcopy').addEventListener('click', () => {
                const txt = 'pregnancy={\n'
                    + '    "spine_scale": [' + cur.map(v => v.toFixed(2)).join(', ') + '],\n'
                    + '    "grow_ms": ' + (p.grow_ms || 2600) + ',\n'
                    + '},';
                navigator.clipboard.writeText(txt).catch(() => {});
                appendMessage('ai', txt);
            });

            appendMessage('ai',
                '배 시험 창을 열었습니다. 슬라이더로 맞춘 뒤 복사해서 '
                + 'avatar.py 의 pregnancy 에 적으세요.\n'

        // ============================================================
        // 기억 삭제
        // ============================================================

        async function handleMemoryDeleteCommand(text) {

            if (
                text !== '/기억삭제' &&
                text !== '/기억 초기화'
            ) {

                return false;
            }


            /*
             * 현재 Flask에 /api/memory/clear가 없다면
             * 서버에서 404가 발생한다.
             *
             * 따라서 이 명령어는 Flask API를 추가한 후
             * 실제 기억 삭제가 실행된다.
             */

            try {

                const res =
                    await fetch(
                        '/api/memory/clear',
                        {
                            method: 'POST'
                        }
                    );


                const data =
                    await res.json();


                if (res.ok) {

                    appendMessage(
                        'ai',
                        data.message ||
                        '기억을 초기화했어!'
                    );

                } else {

                    appendMessage(
                        'ai',
                        data.error ||
                        '기억 삭제에 실패했어.'
                    );
                }

            } catch (error) {

                console.error(
                    '기억 삭제 오류:',
                    error
                );


                appendMessage(
                    'ai',
                    '기억 삭제 서버와 연결할 수 없어.'
                );
            }


            return true;
        }


        // ============================================================
        // 메시지 전송
        // ============================================================

                async function sendMessage() {

            if (isWaitingForAI) {

                return;
            }


            let text =
                chatInput.value.trim();


            if (!text) {

                return;
            }


            chatInput.value = '';


            // 말을 걸었다. 돌아다니던 중이면 멈추고 이쪽을 본다.
            faceUser();


            // --------------------------------------------------------
            // 명령어 처리
            // --------------------------------------------------------

            if (
                handleExpressionCommand(text)
            ) {

                return;
            }


            if (
                handleHelpCommand(text)
            ) {

                return;
            }


            if (
                handleBackgroundCommand(text)
            ) {

                return;
            }


            if (
                handleClothCommand(text)
            ) {

                return;
            }


            if (
                handleAffinityCommand(text)
            ) {

                return;
            }


            if (
                handleVoiceCommand(text)
            ) {

                return;
            }


            // 아이 — 시험용
            if (
                handleChildCommand(text)
            ) {

                return;
            }


            // 기억을 치워 두거나 되찾는다
            if (
                handleMemoryCommand(text)
            ) {

                return;
            }


            // 가위바위보는 모델에게 묻지 않고 바로 단추를 가리킨다
            if (
                handleRpsCommand(text)
            ) {

                return;
            }


            // /쑥스러움 처럼 동작 이름을 바로 부르는 것
            if (
                handleMotionCommand(text)
            ) {

                return;
            }


            if (
                await handleMemoryDeleteCommand(text)
            ) {

                return;
            }


            // --------------------------------------------------------
            // 일반 대화
            // --------------------------------------------------------

            const wasSleeping =
                isSleeping;


            wakeUp();

            appendMessage(
                'user',
                text
            );

            resetTimers();


            if (wasSleeping) {

                // 얼굴은 여기서 정하지 않는다.
                //
                // 예전에는 여기서 곧바로 놀라게 했는데, 모델이 답을
                // 내놓기까지 8초가 걸리는 동안 그 얼굴로 굳어 있었다.
                // 놀랄지 말지는 아래 깨어나기 차례가 호감을 보고 정한다
                // (behavior.wake.surprise_upto · wake_surprise_ms).
                // 지금은 눈만 뜨고(wakeUp) 기다린다.

                // 대신 잠결 얼굴로 기다린다.
                //
                // 답이 오기까지 얼굴이 비어 있으면, 깨웠는데 아무 일도
                // 안 일어난 것처럼 보인다. 놀람과 달리 이 얼굴은
                // 오래 있어도 어색하지 않다 — 원래 오래 가는 얼굴이다.
                applyExpression('drowsy');

                // 이모지도 지정하지 않는다.
                // 😲 를 쓰라고 시키면 그것이 답변에 실려 오고, 서버가
                // 놀람 신호로 걷어낸 뒤 화면이 기지개·손인사 도중에
                // 되살린다. 웃으며 기지개를 켜다 놀란 얼굴이 됐다.
                // 어떤 얼굴로 깰지는 사이가 정할 일이다.

                text = text + " (상황 참고: 다이아는 자고 있다가 방금 상대가 깨워서 막 눈을 떴어. 과한 비명이나 호들갑은 절대 금지하고, 막 잠에서 깬 사람답게 차분하게 이야기를 이어가줘.)";
            }


            // AI 응답 중복 요청 방지
            isWaitingForAI = true;

            sendButton.disabled = true;


            try {

                const res =
                    await fetch(
                        '/api/chat',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                message: text
                            })
                        }
                    );


                if (!res.ok) {

                    throw new Error(
                        `HTTP ${res.status}`
                    );
                }


                const data =
                    await res.json();


                if (
                    !data ||
                    typeof data.reply !== 'string'
                ) {

                    throw new Error(
                        '잘못된 API 응답'
                    );
                }


                if (data.silent) {

                    // 입을 닫았다. 말풍선도 립싱크도 없다.
                    // 다만 아무 일도 안 일어나면 고장 난 것처럼 보이므로
                    // 표정과 짧은 표시만 남긴다.
                    showSilence(data.expression || 'angry');

                } else {

                    // 자다 깼으면 놀람은 스치듯 지나가고 곧 제 얼굴로 돌아온다.
                    // 다정하게 깨웠으면 반가워하며 손을 흔든다.
                    const wake = wasSleeping;

                    // 자다 깼을 때는 깨우는 말투에 따라 갈린다.
                    //
                    //   다정하게  : 놀람 -> 기쁨 + 손 흔들기 + 말하기를 한꺼번에
                    //   그냥      : 놀람 -> 무표정으로 말하고, 말을 마친 뒤 기지개
                    //
                    // 그냥 깨웠을 때 기지개가 뒤로 가는 이유는, 잠을 터는 일이
                    // 대답보다 먼저 나오면 말을 걸어 놓고 기다리는 꼴이 되어서다.
                    // 자다 깼을 때. 사이가 얼마나 깊은지로 셋으로 갈린다.
                    //
                    //   낮으면  놀라기만 하고 곧 대화한다.
                    //   보통    기쁨 + 기지개로 잠을 털고 이야기를 시작한다.
                    //   깊으면  기지개를 켠 뒤 손을 흔들며 반긴다.
                    const wk = (ENTITY && ENTITY.behavior
                        && ENTITY.behavior.wake) || {};

                    // 호감은 이번 답변에 실려 온 값을 쓴다.
                    //
                    // 화면이 들고 있던 값(myAffinity)은 이 창을 띄운 뒤로
                    // 갱신이 안 됐을 수 있다. 창을 여러 개 열어 두고 다른
                    // 창에서 사이가 달라지면, 이 창은 옛 숫자로 판단한다.
                    // 실제로 호감 0 인데 기지개를 켜는 일이 있었다.
                    const aff = (data.relationship
                        && typeof data.relationship.affinity === 'number')
                        ? data.relationship.affinity
                        : ((typeof myAffinity === 'number') ? myAffinity : 0);

                    // 놀라는 것은 사이가 없다시피 할 때뿐이다.
                    // 조금이라도 정이 들면 누가 깨우는지 알아서 안 놀란다.
                    const startles = aff <= (typeof wk.surprise_upto === 'number'
                        ? wk.surprise_upto : 0);

                    // 기지개는 친구부터. 잠을 털며 일어난다.
                    const stretches = aff >= (typeof wk.stretch_from === 'number'
                        ? wk.stretch_from : 40);

                    const warm = aff >= (typeof wk.warm_from === 'number'
                        ? wk.warm_from : 160);

                    const finalFace = wake
                        ? (stretches ? 'joy' : 'neutral')
                        : (data.expression || 'neutral');

                    const surpriseMs = (ENTITY && ENTITY.behavior
                        && ENTITY.behavior.wake_surprise_ms) || 420;

                    if (typeof data.mood === 'number') {
                        myMood.level = data.mood;
                    }
                    if (typeof data.lover === 'boolean') {
                        myLover.yes = data.lover;
                    }

                    // 같이 걷자고 했으면 발이 풀린다. 그만하자면 멈춘다.
                    if (data.walk === 'start') {
                        setWalking(true);
                    } else if (data.walk === 'stop') {
                        setWalking(false);
                    }

                    if (wake) {

                        // 자다 깼을 때는 몸이 먼저고 말이 나중이다.
                        //
                        //   놀랄 사이   놀람 -> 말하기
                        //   친구 이상   기지개 -> 말하기
                        //   사랑 이상   기지개 -> 손인사하면서 말하기
                        //
                        // 잠은 털고 나서 말한다. 말부터 해 놓고 기지개를 켜면
                        // 말해 놓고 딴짓하는 꼴이 된다.
                        // 다만 인사는 말과 함께 간다 — 사람은 손을 흔들면서 말한다.
                        if (startles) applyExpression('surprised');

                        const talk = (face) => {
                            showReply(data.reply, face || finalFace, data.cues);
                        };

                        const wave = () => {
                            if (!warm) { talk('joy'); return; }

                            // 손을 흔들면서 말을 시작한다.
                            //
                            // 흔들기를 다 마치고 입을 여는 것보다,
                            // 손이 올라가는 동안 말이 나오는 쪽이 자연스럽다.
                            // 사람은 인사하면서 말한다.
                            roam.state = 'gesture';
                            playMotion('wave');
                            talk('fun');
                        };

                        setTimeout(() => {

                            if (!stretches) {
                                applyExpression(finalFace);
                                talk();
                                return;
                            }


                            // 기지개를 켤 때는 기쁨으로 못박는다.
                            // 놀란 얼굴로 몸을 펴지 않게 하려는 것이다.
                            applyExpression('joy');
                            roam.state = 'gesture';
                            playMotion('stretch');

                            const st = motionByKey('stretch');
                            setTimeout(wave, (st ? st.duration : 2.8) * 1000);

                        }, startles ? surpriseMs : 0);

                    } else {
                        showReply(data.reply, finalFace, data.cues);
                    }

                    // 괄호로 만졌다면 몸도 그에 맞게 움직인다
                    if (data.motion) {
                        roam.state = 'gesture';
                        playMotion(data.motion);
                    }
                }


                // 말 한마디에도 사이는 움직인다. 눈금에 반영한다.
                if (data.relationship &&
                    typeof data.relationship.affinity === 'number') {

                    myAffinity = data.relationship.affinity;
                    myStageKey = data.relationship.stage || myStageKey;

                    setAffinity(
                        data.relationship.affinity,
                        data.relationship.label
                    );

                    buildToolMenu();
                }


            } catch (err) {

                console.error(
                    "채팅 API 호출 오류:",
                    err
                );


                appendMessage(
                    'ai',
                    '앗, AI 서버와 연결이 안 됐어. 잠시 후 다시 말해줘!'
                );


            } finally {

                isWaitingForAI = false;

                sendButton.disabled = false;

            }
        }


        // ============================================================
        // 깨우기
        // ============================================================

        function wakeUp() {

            isSleeping = false;

            zzzIndicator.style.display =
                'none';

            setEyeState(false);

            resetToAttentionPose();
        }


        // ============================================================
        // AI 응답 표시
        // ============================================================

                                function showReply(
            reply,
            expression,
            cues
        ) {

            appendMessage(
                'ai',
                reply
            );


            speechBubble.innerText =
                reply;

            speechBubble.style.display =
                'block';


            // 표정을 얼마나 붙들지 정하는 데만 쓴다.
            // 말풍선 시각은 armBubbleHide 가 소리 길이로 따로 정한다.
            const totalSeconds = Math.max(reply.length, 30);


            applyExpression(
                expression
            );


            // 말풍선을 우선 어림값으로 걸어 둔다.
            // speak() 가 답을 못 주고 끝나도 말풍선이 영영 남지는 않는다.
            armBubbleHide(guessSpeakMs(reply));

            // 소리를 내고, 그 길이에 입과 말풍선을 맞춘다.
            //
            // 브라우저 목소리는 미리 길이를 알 수 없어 0 이 온다.
            // 그때는 어림값 그대로 둔다 — 대신 첫 문장을 말해 보고
            // 잰 속도(voice.msPerChar)가 다음 문장부터 반영된다.
            speak(reply).then(ms => {
                playLipSync(reply, ms);
                if (ms > 0) armBubbleHide(ms);
            });


            // 서버가 걷어낸 이모지·괄호를 그 자리에서 표정과 몸짓으로 되살린다.
            //
            // 되돌아갈 얼굴은 평온이 아니라 '이 답변의 얼굴'이다.
            // 문장 중간에 째려봤다고 해서 그 뒤가 무표정일 이유는 없다.
            // 말하는 길이도 넘겨준다 — 말이 끝나기도 전에 얼굴이 꺼지면
            // 문장 뒤쪽이 무표정으로 흘러간다.
            playCues(cues, expression, reply.length);


            if (window.expressionChangeTimer) {
                clearTimeout(window.expressionChangeTimer);
            }


            // 🚀 [유저님의 최종 공식] 놀람은 딱 0.5초(0.5000ms), 그 외 감정들은 2초(2000ms) 유지 후 무표정 전환!
            if (totalSeconds > 3 && expression !== 'neutral') {
                const duration = (expression === 'surprised') ? 1000 : 3000;
                
                window.expressionChangeTimer = setTimeout(() => {
                    applyExpression('neutral');
                }, duration);
            }


            startInactivityTimers();
        }




        // ============================================================
        // 채팅 메시지 추가 (유저님의 소중한 원본 로직을 100% 보존합니다)
        // ============================================================

        function appendMessage(
            role,
            text
        ) {

            const chatMessages =
                document.getElementById(
                    'chat-messages'
                );


            const msgDiv =
                document.createElement(
                    'div'
                );


            msgDiv.className =
                `msg ${
                    role === 'user'
                        ? 'user-msg'
                        : 'ai-msg'
                }`;


            msgDiv.innerText =
                text;


            chatMessages.appendChild(
                msgDiv
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;
        }


        // ============================================================
        // 비활동 타이머
        // ============================================================

        // 기다리는 시간도 개체가 정한다. 이 파일이 숫자를 들고 있지 않는다.
        function behaviorSec(key, fallback) {
            const b = (ENTITY && ENTITY.behavior) || {};
            const v = b[key];
            return (typeof v === 'number' && v > 0) ? v : fallback;
        }


        function startInactivityTimers() {

            resetTimers();

            // 조용해지면 다이아가 먼저 말을 건다.
            talkTimer = setTimeout(() => {

                if (isSleeping || isWaitingForAI) return;

                // 잠들기 타이머는 firstTalk 이 말을 마친 뒤에 건다.
                // showReply 가 끝에서 startInactivityTimers 를 다시 부르므로,
                // 여기서 미리 걸어두면 그때 지워진다.
                firstTalk();

            }, behaviorSec('first_talk_timeout_sec', 120) * 1000);
        }


        // ============================================================
        // 먼저 말 걸기
        //
        // 무슨 말을 거는지는 사이가 얼마나 깊은지에 달렸다.
        // 그 문장은 서버가 단계별로 들고 있으므로 여기서 정하지 않는다.
        // 화면이 문장을 쥐고 있으면 단계가 바뀌어도 같은 말만 하게 된다.
        // ============================================================

        async function firstTalk() {

            try {

                const res = await fetch('/api/first-talk');

                if (!res.ok) throw new Error('HTTP ' + res.status);

                const data = await res.json();

                // 원수 단계처럼 먼저 걸 말이 없는 사이면 조용히 넘어간다
                if (data.speak && data.reply) {

                    showReply(
                        data.reply,
                        data.expression || 'neutral',
                        data.cues
                    );
                }

                // 한동안 조용했다는 뜻이다. 이제 돌아다녀도 된다.
                mayRoam = true;

            } catch (e) {

                // 못 불러왔다고 아무 문장이나 대신 내보내면
                // 지금 사이와 어긋난 말이 나온다. 차라리 가만히 있는다.
                console.warn(
                    '[diamondAI] 먼저 말 걸기 실패, 이번엔 건너뜁니다.',
                    e
                );

            } finally {

                // 기다리는 사이에 상대가 말을 걸었다면 그쪽이 우선이다.
                // 그때는 답변이 오면서 타이머가 다시 걸린다.
                if (!isSleeping && !isWaitingForAI) {
                    armSleepTimer();
                }
            }
        }


        // ============================================================
        // 잠들기 타이머
        //
        // 먼저 말을 걸었는데도 대답이 없으면 잠든다.
        // 한 번 걸었으면 또 걸지 않으므로 말 걸기 타이머는 여기서 끈다.
        // ============================================================

        function armSleepTimer() {

            if (talkTimer) {
                clearTimeout(talkTimer);
                talkTimer = null;
            }

            if (sleepTimer) {
                clearTimeout(sleepTimer);
                sleepTimer = null;
            }

            // 잠들지 않는 단계가 있다. 상대가 조용해도 눈을 감지 않는다.
            //
            // 대신 다시 말을 건다. firstTalk 이 끝나면 이 함수를 또 부르니
            // 대답이 올 때까지 혼자 말이 이어진다.
            const s = curStage();

            if (s && s.never_sleeps) {

                sleepTimer = setTimeout(() => {

                    if (isSleeping || isWaitingForAI) return;

                    firstTalk();

                }, behaviorSec('nudge_timeout_sec', 45) * 1000);

                return;
            }

            sleepTimer = setTimeout(() => {

                if (isSleeping || isWaitingForAI) return;

                goToSleep();

            }, behaviorSec('sleep_timeout_sec', 120) * 1000);
        }


        // ============================================================
        // 타이머 초기화
        // ============================================================

        function resetTimers() {

            if (talkTimer) {

                clearTimeout(
                    talkTimer
                );

                talkTimer = null;
            }


            if (sleepTimer) {

                clearTimeout(
                    sleepTimer
                );

                sleepTimer = null;
            }
        }


        // ============================================================
        // 잠들기
        // ============================================================

        function goToSleep() {

            isSleeping = true;

            zzzIndicator.style.display =
                'block';

            speechBubble.style.display =
                'none';


            stopLipSync();

            // 표정을 먼저 지우고 눈을 감긴다.
            // 순서가 반대면 applyExpression 이 감긴 눈을 도로 지운다.
            applyExpression(
                'neutral'
            );

            setEyeState(true);
        }


        // ============================================================
        // Enter 키
        // ============================================================

        chatInput.addEventListener(
            'keydown',
            (event) => {

                if (
                    event.key === 'Enter'
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );


        // ============================================================
        // 전송 버튼
        // ============================================================

        sendButton.addEventListener(
            'click',
            sendMessage
        );


        // ============================================================
        // 화면 크기 변경
        // ============================================================

        window.addEventListener(
            'resize',
            () => {

                camera.aspect =
                    canvas.clientWidth /
                    canvas.clientHeight;

                camera.updateProjectionMatrix();


                renderer.setSize(
                    canvas.clientWidth,
                    canvas.clientHeight
                );
            }
        );


        // ============================================================
        // 아바타 시작
        // ============================================================

        loadAvatar(
            '/static/avatar.vrm'
        );

    </script>

</body>
