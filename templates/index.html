<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diamondAI - Virtual Avatar</title>

    <!-- THREE.js 및 THREE-VRM CDN -->
    <script src="https://unpkg.com/three@0.137.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.11/lib/three-vrm.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #avatar-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #2c2d42 0%, #0f0f17 100%);
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 지금 무엇으로 만지는지 */
        #tool-badge {
            position: absolute;
            left: 14px;
            top: 14px;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #dfe1f0;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            z-index: 12;
            cursor: context-menu;
            user-select: none;
        }

        /* 가위바위보 */
        #rps-bar {
            position: absolute;
            left: 14px;
            top: 52px;
            z-index: 12;
            user-select: none;
        }

        #rps-open {
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #dfe1f0;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        /* ----------------------------------------------------------
           조이스틱 — 마우스로 걷기

           방향키와 같은 축을 만든다. 위아래는 걷기, 좌우는 돌아서기.
           키와 달리 세기가 있어서 살살 밀면 천천히 간다.
           ---------------------------------------------------------- */
        #stick-pad {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background: rgba(20, 22, 42, 0.55);
            border: 1px solid #3a3f68;
            z-index: 13;
            touch-action: none;
            user-select: none;
            cursor: grab;
        }

        #stick-pad.grabbed { cursor: grabbing; }

        /* 가운데 십자. 어느 쪽이 앞인지 알려 준다 */
        #stick-pad::before,
        #stick-pad::after {
            content: '';
            position: absolute;
            background: #3a3f68;
            opacity: 0.5;
        }

        #stick-pad::before {
            left: 50%; top: 17px; bottom: 17px;
            width: 1px; margin-left: -0.5px;
        }

        #stick-pad::after {
            top: 50%; left: 17px; right: 17px;
            height: 1px; margin-top: -0.5px;
        }

        #stick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46px;
            height: 46px;
            margin: -23px 0 0 -23px;
            border-radius: 50%;
            background: rgba(96, 104, 168, 0.85);
            border: 1px solid #8b93d4;
            pointer-events: none;
        }

        #stick-pad.grabbed #stick-knob {
            background: rgba(132, 142, 220, 0.95);
        }

        /* 앉기와 점프. 마우스만 쓸 때 Shift·스페이스를 대신한다 */
        #stick-keys {
            position: absolute;
            left: 150px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 13;
            user-select: none;
        }

        #stick-keys button {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #dfe1f0;
            font-size: 0.74rem;
            font-family: inherit;
            cursor: pointer;
        }

        #stick-keys button:hover { background: rgba(42, 47, 82, 0.9); }
        #stick-keys button.on { background: #4a3f77; border-color: #7a68b0; }

        #rps-open:hover { background: rgba(42, 47, 82, 0.9); }

        #rps-open.on { background: #4a3f77; border-color: #7a68b0; }

        /* 말로 가위바위보를 청했을 때 어느 단추인지 알려준다 */
        #rps-open.call { animation: rpscall 0.85s ease-in-out 4; }

        @keyframes rpscall {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(160, 140, 230, 0.0);
                transform: scale(1);
            }
            45% {
                box-shadow: 0 0 0 9px rgba(160, 140, 230, 0.32);
                transform: scale(1.07);
            }
        }

        #rps-hands {
            display: none;
            gap: 6px;
            margin-top: 7px;
        }

        #rps-hands.open { display: flex; }

        #rps-hands button {
            background: rgba(20, 22, 42, 0.82);
            border: 1px solid #3a3f68;
            color: #dfe1f0;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            font-size: 1.25rem;
            cursor: pointer;
            font-family: inherit;
            line-height: 1;
        }

        #rps-hands button:hover:not(:disabled) {
            background: #353b68;
            transform: translateY(-2px);
        }

        #rps-hands button:disabled { opacity: 0.45; cursor: default; }

        #rps-hands button b {
            display: block;
            font-size: 0.62rem;
            font-weight: 500;
            color: #8f93b8;
            margin-top: 2px;
        }

        /* 우클릭 도구 고르기 */
        #tool-menu {
            position: absolute;
            display: none;
            background: #1b1e36;
            border: 1px solid #3a3f68;
            border-radius: 10px;
            padding: 6px;
            z-index: 30;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            min-width: 178px;
            user-select: none;
        }

        #tool-menu .head {
            font-size: 0.72rem;
            color: #8f93b8;
            padding: 4px 10px 7px;
            border-bottom: 1px solid #2c3050;
            margin-bottom: 4px;
        }

        #tool-menu .item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            color: #dfe1f0;
            font-size: 0.88rem;
        }

        #tool-menu .item:hover { background: #2a2f52; }

        #tool-menu .item.on { background: #4a3f77; }

        #tool-menu .item .icon { font-size: 1.05rem; width: 20px; text-align: center; }

        #tool-menu .item .desc {
            display: block;
            font-size: 0.72rem;
            color: #8f93b8;
        }

        #tool-menu .item.locked { opacity: 0.5; }

        #tool-menu .item .lock {
            margin-left: auto;
            font-size: 0.7rem;
            color: #d9a441;
        }

        /* 지금 어떤 사이이고 어떤 기분인지 */
        #state-panel {
            position: absolute;
            right: 14px;
            top: 14px;
            width: 210px;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            border-radius: 12px;
            padding: 11px 13px 12px;
            z-index: 12;
            color: #dfe1f0;
            font-size: 0.82rem;
            user-select: none;
        }

        #state-panel .row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        #state-panel .cap {
            color: #8f93b8;
            font-size: 0.72rem;
            width: 26px;
        }

        #stage-label { font-weight: 700; }

        #affinity-num {
            margin-left: auto;
            color: #8f93b8;
            font-variant-numeric: tabular-nums;
        }

        #affinity-track {
            position: relative;
            height: 8px;
            margin-top: 8px;
            background: #101228;
            border-radius: 999px;
            overflow: visible;
        }

        #affinity-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #4a6fb0, #a05a8a);
            transition: width 0.6s ease;
        }

        #affinity-marks { position: absolute; inset: 0; }

        #affinity-marks i {
            position: absolute;
            top: -2px;
            width: 1px;
            height: 12px;
            background: #4a4f78;
        }

        #affinity-knob {
            position: absolute;
            top: -3px;
            width: 14px;
            height: 14px;
            margin-left: -7px;
            border-radius: 50%;
            background: #e8e9f5;
            box-shadow: 0 0 8px rgba(230, 231, 245, 0.5);
            transition: left 0.6s ease;
        }

        #mood-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8f93b8;
            transition: background 0.35s ease;
            display: inline-block;
        }

        #mood-label { font-weight: 700; }

        #mood-bars {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        #touch-zones {
            font-size: 0.72rem;
            line-height: 1.6;
            color: #8f93b8;
        }

        #touch-zones b { color: #dfe1f0; font-weight: 600; }
        #touch-zones i { color: #6a6e90; font-style: normal; }

        #mood-bars .m {
            flex: 1;
            height: 4px;
            border-radius: 999px;
            background: #262a4a;
            transition: background 0.3s ease, opacity 0.3s ease;
            opacity: 0.5;
        }

        /* 친밀도가 움직일 때 뜨는 숫자 */
        #affinity-pop {
            position: absolute;
            right: 26px;
            top: 44px;
            z-index: 13;
            font-weight: 800;
            font-size: 1rem;
            opacity: 0;
            pointer-events: none;
        }

        #affinity-pop.up { color: #86e08a; }
        #affinity-pop.down { color: #ff8b8b; }

        #affinity-pop.show {
            animation: popfloat 1.3s ease-out;
        }

        @keyframes popfloat {
            0%   { opacity: 0; transform: translateY(6px); }
            18%  { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-22px); }
        }

        /* 말풍선 */
        #speech-bubble {
            position: absolute;
            /* 자리는 화면이 매 프레임 얼굴 옆으로 옮긴다.
               아래 값은 아직 머리를 못 찾았을 때만 쓰인다.
               왼쪽 끝을 얼굴에 붙이므로 0, 세로는 가운데 -50%.
               (다이아가 이쪽을 보고 서 있어 그의 왼쪽은 화면에서 오른쪽이다) */
            top: 30%;
            left: 55%;
            transform: translate(0, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #222;
            padding: 15px 22px;
            border-radius: 18px;
            font-size: 0.95rem;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 10;
            font-weight: 600;
            transition: opacity 0.5s ease;
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            top: 20px;
            left: -12px;
            border-width: 8px 12px 8px 0;
            border-style: solid;
            border-color:
                transparent
                rgba(255, 255, 255, 0.95)
                transparent
                transparent;
        }

        /* 수면 표시 */
#zzz-indicator {
    position: absolute;

    /* 자리는 CSS 가 정하지 않는다.
       예전에는 top 18% · left 58% 로 화면에 못 박아 두었다.
       카메라가 정물이던 때는 그게 곧 다이아 귀 옆이었지만,
       이제는 카메라가 상대의 눈이라 걸어 다니면 💤 가
       얼굴에서 떨어져 화면에 들러붙어 따라온다.

       그래서 말풍선처럼 머리 자리를 화면 좌표로 투영해
       updateZzzPos() 가 매 프레임 옮긴다. 여기 값은 아직
       한 번도 안 옮겼을 때를 위한 것이다. */
    top: 18%;
    left: 58%;
    font-size: 3.2rem;
    font-weight: bold;
    color: #a29bfe;
    animation: sleepFloat 2s infinite ease-in-out;
    display: none; 
    z-index: 10;
}


        @keyframes sleepFloat {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-20px) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translateY(-40px) scale(0.8);
                opacity: 0;
            }
        }

        #chat-container {
            width: 380px;
            background: #12121a;
            border-left: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
        }

        #chat-header {
            padding: 20px;
            background: #1a1a26;
            border-bottom: 1px solid #2a2a3a;
            font-size: 1.2rem;
            font-weight: bold;
            color: #74b9ff;
        }

        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: #0984e3;
            color: #fff;
        }

        .ai-msg {
            align-self: flex-start;
            background: #2d3436;
            color: #dfe6e9;
        }

        #chat-input-area {
            padding: 15px;
            background: #1a1a26;
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f17;
            color: #fff;
            outline: none;
        }

        #send-btn {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            background: #6c5ce7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div id="avatar-container">

        <div id="speech-bubble">...</div>

        <div id="zzz-indicator">💤</div>

        <canvas id="canvas3d"></canvas>

        <!-- 지금 무엇으로 만지고 있는지 -->
        <div id="tool-badge" title="우클릭해서 바꾸기">🖐 손</div>

        <!-- 가위바위보 -->
        <div id="rps-bar">
            <button id="rps-open">✌ 가위바위보</button>
            <div id="rps-hands"></div>
        </div>

        <!-- 마우스로 걷기 -->
        <div id="stick-pad"><div id="stick-knob"></div></div>

        <div id="stick-keys">
            <button id="stick-jump" title="스페이스">점프</button>
            <button id="stick-sit" title="Shift">앉기</button>
        </div>

        <!-- 우클릭하면 뜨는 도구 고르기 -->
        <div id="tool-menu"></div>

        <!-- 지금 어떤 사이이고 어떤 기분인지 -->
        <div id="state-panel">

            <div class="row">
                <span class="cap">호감</span>
                <span id="stage-label">…</span>
                <span id="affinity-num">0</span>
            </div>

            <div id="affinity-track">
                <div id="affinity-fill"></div>
                <div id="affinity-marks"></div>
                <div id="affinity-knob"></div>
            </div>

            <div class="row" style="margin-top:9px">
                <span class="cap">기분</span>
                <span id="mood-dot"></span>
                <span id="mood-label">평온</span>
            </div>

            <div id="mood-bars"></div>

            <div class="row" style="margin-top:9px; align-items:flex-start">
                <span class="cap">터치</span>
                <span id="touch-zones"></span>
            </div>

        </div>

        <div id="affinity-pop"></div>

    </div>

    <div id="chat-container">

        <div id="chat-header">
            diamondAI Chat
        </div>

        <div id="chat-messages"></div>

        <div id="chat-input-area">

            <input
                type="text"
                id="chat-input"
                placeholder="메시지를 입력하세요..."
            >

            <button id="send-btn">
                전송
            </button>

        </div>

    </div>

    <script>

        // ============================================================
        // THREE.JS 기본 설정
        // ============================================================

        const canvas = document.getElementById('canvas3d');

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            30,
            canvas.clientWidth / canvas.clientHeight,
            0.1,
            20.0
        );

        // 화면에서 아바타가 앉는 높이.
        //
        // 눈이 화면 위쪽에 걸려 있어서, 눈이 지금 목이 있던 자리로
        // 내려오도록 시점을 통째로 7.3cm 올렸다.
        // (머리 본 1.264 - 목 본 1.191 = 0.073)
        // 카메라와 바라보는 곳을 같은 만큼 올리므로 각도는 그대로다.
        const VIEW_LIFT = 0.073;

        // 바라보는 곳 — 아바타가 화면에 앉는 자리. 여기는 그대로 둔다.
        const LOOK_Y = 1.05 + VIEW_LIFT;

        // 보는 사람의 눈높이. 원래는 LOOK_Y 보다 10cm 위(1.223)라
        // 다이아를 살짝 내려다보고 있었다. 올려다보는 구도로 내렸다.
        // 이 값만 바꾸면 각도가 통째로 달라진다 — LOOK_Y 보다 낮으면
        // 올려다보고, 높으면 내려다본다.
        const CAM_Y = 0.49;

        camera.position.set(0.0, CAM_Y, 1.65);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });

        renderer.setSize(
            canvas.clientWidth,
            canvas.clientHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        // 조명 — 한 방향에서만 고르게 비추면 쇄골이나 목선 같은 굴곡이 죽는다.
        // 주광을 비스듬히 세우고 반대편에서 약한 빛을 하나 더 넣어
        // 그늘이 생기게 한다. 전체 밝기는 낮춰서 대비를 살린다.
        const light = new THREE.DirectionalLight(0xfff4e8, 1.25);
        light.position.set(0.8, 1.35, 0.9).normalize();
        scene.add(light);

        // 뒤에서 윤곽을 살려 주는 빛
        const rimLight = new THREE.DirectionalLight(0xa8b6ff, 0.55);
        rimLight.position.set(-0.9, 0.5, -1.0).normalize();
        scene.add(rimLight);

        // 아래에서 아주 약하게 받쳐 얼굴이 새까매지지 않게
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.18);
        fillLight.position.set(0, -1, 0.4).normalize();
        scene.add(fillLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.28);
        scene.add(ambientLight);


        // ------------------------------------------------------------
        // 바닥
        //
        // 격자만 있으면 허공에 떠 있는 것처럼 보인다.
        // 가장자리로 갈수록 옅어지는 원판을 깔고 발밑에 그림자를 둔다.
        // 그림 파일 없이 캔버스로 만들어 쓴다.
        // ------------------------------------------------------------

        function makeFadeTexture(inner, outer, stops) {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const g = c.getContext('2d');
            const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
            stops.forEach(s => grad.addColorStop(s[0], s[1]));
            g.fillStyle = grad;
            g.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(c);
        }

        function buildFloor(groundY) {
            const floor = new THREE.Mesh(
                // 상대가 걸어 다닐 수 있는 만큼(locomotion.room_radius=6)
                // 보다 조금 넓게. 발밑에서 바닥이 끝나면 허공에 선 꼴이다.
                new THREE.CircleGeometry(6.6, 64),
                new THREE.MeshBasicMaterial({
                    map: makeFadeTexture(0, 0, [
                        [0.0, 'rgba(70,74,112,0.85)'],
                        [0.55, 'rgba(52,56,88,0.55)'],
                        [1.0, 'rgba(30,32,54,0)']
                    ]),
                    transparent: true,
                    depthWrite: false
                })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = groundY + 0.001;
            floor.renderOrder = -2;
            scene.add(floor);

            // 발밑 그림자. 이게 있어야 바닥에 닿아 있는 것처럼 보인다.
            const shadow = new THREE.Mesh(
                new THREE.CircleGeometry(0.34, 32),
                new THREE.MeshBasicMaterial({
                    map: makeFadeTexture(0, 0, [
                        [0.0, 'rgba(0,0,0,0.5)'],
                        [0.6, 'rgba(0,0,0,0.22)'],
                        [1.0, 'rgba(0,0,0,0)']
                    ]),
                    transparent: true,
                    depthWrite: false
                })
            );
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.y = groundY + 0.004;
            shadow.renderOrder = -1;
            scene.add(shadow);

            return shadow;
        }

        // 바닥 — 이게 없으면 걸어도 제자리처럼 보인다.
        // 칸은 0.5m. 넓힌 만큼 칸 수도 늘려야 칸 크기가 그대로다.
        const floorGrid = new THREE.GridHelper(
            14, 28, 0x3a3d5c, 0x2a2d44
        );
        floorGrid.material.transparent = true;
        floorGrid.material.opacity = 0.45;
        floorGrid.position.y = -0.2;
        scene.add(floorGrid);

        const footShadow = buildFloor(-0.2);


        // ============================================================
        // 시점
        //
        // 카메라는 원래 다이아를 따라다니기만 했다. 보고 싶은 각도로
        // 돌려 볼 수가 없었다.
        //
        // 아바타 위에서 끌면 만지는 것이고, 빈 곳에서 끌면 시점을 돌린다.
        // 한 번이라도 사람이 시점을 잡으면 자동 따라가기는 물러난다.
        // 마음대로 돌려 놓은 것을 카메라가 계속 되돌리면 싸우는 꼴이 된다.
        // ============================================================

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, LOOK_Y, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 0.5;
        controls.maxDistance = 6;
        controls.enablePan = false;
        controls.update();

        // 사람이 시점을 잡았는가
        let camFree = false;

        controls.addEventListener('start', () => camFree = true);


        // ============================================================
        // 상대 — 화면 안에 실제로 서 있는 사람
        //
        // 카메라가 곧 이 사람의 눈이다. 몸은 투명해서 본인 눈에는
        // 안 보이지만 월드에는 실제로 있다. 그래서 다이아가 그 자리를
        // 보고, 멀어지면 따라오고, 파고들면 밀려난다.
        // 손이 닿는 거리도 이 몸이 정한다 — 만지려면 다가가야 한다.
        //
        // 거리 숫자는 여기 안 적는다. locomotion 에 있다.
        // ============================================================

        const FLOOR_Y = -0.2;          // 바닥. locomotion.ground_y 와 같다

        // 서 있을 때 눈높이(월드).
        //
        // 처음에는 CAM_Y(0.49)를 그대로 물려받게 했는데, 그건 바닥에서
        // 0.69m 라 다이아의 무릎이 눈앞에 왔다. 카메라가 정물일 때
        // 낮춘 값과 사람이 서 있는 키는 같은 값일 수가 없다.
        //
        // VRM 에서 잰 다이아 (바닥 기준):
        //     눈 1.525 · 머리 1.464 · 가슴 1.352 · 엉덩이 1.195 · 발 0.309
        //
        // 눈을 맞추는 높이로 둔다 — 바닥에서 1.53m, 월드로 1.33.
        const USER_EYE = 1.33;

        // 앉았을 때. 바닥까지의 높이를 절반쯤으로 줄인다.
        // 바닥에서 0.69m 라 이때 다이아의 다리와 발에 손이 닿는다.
        const USER_SIT = FLOOR_Y + (USER_EYE - FLOOR_Y) * 0.45;

        const USER_SPEED = 1.05;       // 걷는 속도 m/s
        const USER_TURN = 2.2;         // 방향키로 도는 속도 rad/s
        const USER_JUMP = 2.3;         // 뛰어오르는 처음 속도 m/s
        const USER_GRAV = 7.0;         // 중력 m/s^2
        const LOOK_SENS = 0.0042;      // 마우스로 둘러보는 감도

        const user = {
            on: true,            // 1인칭인가. F 로 끈다
            x: 0, z: 1.65,       // 발이 딛고 선 자리
            yaw: Math.PI,        // 보는 방향. PI 면 -z(다이아) 쪽
            pitch: 0,            // 위아래로 든 고개
            lift: 0, vy: 0,      // 뛰어오른 높이와 속도
            sit: 0,              // 0=선다 1=앉는다. 사이를 부드럽게 오간다
            eye: 1.33            // 지금 눈높이. USER_EYE 로 시작한다
        };

        // 눌려 있는 키. keydown 은 한 번이지만 걷기는 누르는 내내여야 한다.
        const held = Object.create(null);

        // 투명한 몸. 보이지는 않아도 자리는 차지한다.
        // H 를 누르면 판정구와 함께 모습이 드러난다.
        const USER_HIDDEN = new THREE.MeshBasicMaterial({ visible: false });
        const USER_SHOWN = new THREE.MeshBasicMaterial({
            color: 0x6cf0d0, wireframe: true,
            transparent: true, opacity: 0.5
        });

        const userBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.17, 0.17, 1.0, 10, 1),
            USER_HIDDEN
        );
        scene.add(userBody);

        // 1인칭에서는 궤도 시점이 카메라를 쥐면 안 된다. 서로 밀친다.
        controls.enabled = !user.on;
        camera.rotation.order = 'YXZ';

        function userForwardX() { return Math.sin(user.yaw); }
        function userForwardZ() { return Math.cos(user.yaw); }

        // locomotion 에 적힌 거리를 꺼내 온다. 아직 개체를 못 받았으면
        // 화면이 들고 있는 값으로 버틴다.
        function followCfg(key, fallback) {
            const L = (ENTITY && ENTITY.locomotion) ? ENTITY.locomotion : null;
            const v = L ? L[key] : undefined;
            return (v === undefined || v === null) ? fallback : v;
        }

        function updateUser(dt) {
            if (!user.on) return;

            // ---- 좌우는 돌아서고, 위아래는 보는 쪽으로 걷는다 ----
            //
            // 방향키와 조이스틱이 같은 축을 민다. 둘을 더한 뒤
            // -1~1 로 자르므로 같이 눌러도 두 배로 빨라지지 않는다.
            let turn = 0, walk = 0;

            if (held.ArrowLeft) turn += 1;
            if (held.ArrowRight) turn -= 1;
            if (held.ArrowUp) walk += 1;
            if (held.ArrowDown) walk -= 1;

            // 조이스틱은 세기가 있다. 손 떨림으로 슬금슬금 가지 않도록
            // 가운데 언저리는 0으로 죽인다.
            if (stick.on) {
                if (Math.abs(stick.x) > STICK_DEAD) turn -= stick.x;
                if (Math.abs(stick.y) > STICK_DEAD) walk += stick.y;
            }

            turn = Math.max(-1, Math.min(1, turn));
            walk = Math.max(-1, Math.min(1, walk));

            user.yaw += turn * USER_TURN * dt;

            if (walk) {
                // 앉은 채로는 느리다
                const sp = USER_SPEED * (1 - user.sit * 0.55) * walk * dt;
                user.x += userForwardX() * sp;
                user.z += userForwardZ() * sp;
            }

            // 방 밖으로는 못 나간다
            const R = followCfg('room_radius', 6.0);
            const out = Math.hypot(user.x, user.z);
            if (out > R) { user.x *= R / out; user.z *= R / out; }

            // 다이아와 겹치지 않는다. 밀고 들어가면 밀려난다.
            const gap = followCfg('personal_space', 0.5);
            const dx = user.x - roam.x, dz = user.z - roam.z;
            const near = Math.hypot(dx, dz);
            if (near > 1e-4 && near < gap) {
                user.x = roam.x + dx / near * gap;
                user.z = roam.z + dz / near * gap;
            }

            // ---- 앉기: Shift 를 누르고 있거나, 단추를 켜 뒀거나 ----
            // 마우스로는 계속 누르고 있을 수가 없어서 단추는 껐다 켠다.
            const wantSit = (held.Shift || sitLatched) ? 1 : 0;
            user.sit += (wantSit - user.sit) * Math.min(1, dt * 9);

            // ---- 스페이스: 점프 ----
            if (user.lift > 0 || user.vy !== 0) {
                user.vy -= USER_GRAV * dt;
                user.lift += user.vy * dt;
                if (user.lift <= 0) { user.lift = 0; user.vy = 0; }
            }

            user.eye = USER_SIT + (USER_EYE - USER_SIT) * (1 - user.sit);

            // ---- 카메라가 곧 눈이다 ----
            camera.position.set(user.x, user.eye + user.lift, user.z);
            camera.rotation.set(user.pitch, user.yaw + Math.PI, 0);

            // 투명한 몸도 같이 간다. 앉으면 낮아지고 뛰면 뜬다.
            const h = 1 - user.sit * 0.4;
            userBody.scale.y = h;
            userBody.position.set(
                user.x, FLOOR_Y + h * 0.5 + user.lift, user.z
            );
            userBody.rotation.y = user.yaw;
        }


        // 다이아가 상대를 보려면 어느 쪽으로 돌아야 하는가.
        // 1인칭이 아니면 예전처럼 늘 정면(0)이다.
        function yawToUser() {
            if (!user.on) return 0;
            const dx = user.x - roam.x, dz = user.z - roam.z;
            if (Math.hypot(dx, dz) < 1e-3) return roam.yaw;
            return Math.atan2(dx, dz);
        }


        // 멀어졌으면 따라간다.
        function startFollow() {
            if (!user.on || isSleeping || kissWaiting) return false;
            if (!followCfg('follow_enabled', true)) return false;

            const aff = (typeof myAffinity === 'number') ? myAffinity : 0;
            if (aff < followCfg('follow_min_affinity', -40)) return false;

            const dx = user.x - roam.x, dz = user.z - roam.z;
            const dist = Math.hypot(dx, dz);
            if (dist <= followCfg('follow_far', 1.15)) return false;

            const keep = followCfg('follow_near', 0.72);
            roam.targetX = user.x - dx / dist * keep;
            roam.targetZ = user.z - dz / dist * keep;
            roam.following = true;
            roam.state = 'move';
            playMotion('walk');
            return true;
        }

        // 따라가는 동안 목적지는 상대가 걷는 대로 같이 옮긴다.
        // 이미 충분히 가까우면 제자리를 목적지로 두어 스스로 멈추게 한다.
        function trackUser() {
            const dx = user.x - roam.x, dz = user.z - roam.z;
            const dist = Math.hypot(dx, dz);
            const keep = followCfg('follow_near', 0.72);

            if (dist <= keep) {
                roam.following = false;
                roam.targetX = roam.x;
                roam.targetZ = roam.z;
                return;
            }
            roam.targetX = user.x - dx / dist * keep;
            roam.targetZ = user.z - dz / dist * keep;
        }


        // 가까이 다가오면 알아챈다. 한 번 알아채면 다시 멀어졌다
        // 와야 또 놀란다 — 문턱에 걸쳐 서 있을 때 계속 반응하면 우습다.
        let userNoticed = false;

        function updateNotice() {
            if (!user.on || !currentVRM || isSleeping) return;

            const dist = Math.hypot(user.x - roam.x, user.z - roam.z);
            const near = followCfg('notice_dist', 0.62);

            if (!userNoticed && dist < near) {
                userNoticed = true;
                faceUrgency = 1.4;

                // 하던 걸 멈추고 돌아본다. 따라가던 중이면 그냥 둔다.
                if (roam.state === 'move' && !roam.following) {
                    roam.state = 'idle';
                    roam.wait = 2.0;
                    playMotion('idle');
                }

                // 얼굴을 건드려도 되는 때인가.
                //   말하는 중  — 입 모양과 싸운다
                //   답을 기다림 — 곧 그 답의 얼굴이 온다
                //   몸짓 중    — 기지개·손인사는 그 얼굴이 곧 그 동작이다
                if (!isSpeaking() && !isWaitingForAI
                    && !kissWaiting
                    && roam.state !== 'gesture') {
                    const aff = (typeof myAffinity === 'number') ? myAffinity : 0;
                    applyExpression(aff >= 40 ? 'fun' : 'surprised');
                }
            } else if (userNoticed && dist > near + 0.25) {
                userNoticed = false;
            }
        }


        // ------------------------------------------------------------
        // 입맞춤을 기다리기
        //
        // 얼굴을 바짝 들이대면 눈을 감고 기다린다. 그 상태에서 입술로
        // 입을 만져야 입맞춤이 된다 — 다가가는 것만으로는 아무 일도
        // 일어나지 않는다. 눈을 감는 것은 허락이고, 닿는 것은 상대가
        // 하는 일이라서 둘을 나눠 뒀다.
        //
        // 거리·사이·얼굴은 전부 avatar.py 의 touch.kiss 가 갖는다.
        // ------------------------------------------------------------

        const _kissAt = new THREE.Vector3();
        const _kissDir = new THREE.Vector3();
        const _kissFwd = new THREE.Vector3();

        let kissWaiting = false;

        function kissCfg() {
            return (ENTITY && ENTITY.touch && ENTITY.touch.kiss) || null;
        }

        function updateKissWait() {
            const k = kissCfg();

            const off = !k || !k.enabled || !user.on || !currentVRM
                || isSleeping;

            if (off) {
                if (kissWaiting) endKissWait();
                return;
            }

            let head = null;
            try {
                head = currentVRM.humanoid.getBoneNode('head');
            } catch (e) {}
            if (!head) return;

            head.getWorldPosition(_kissAt);
            const dist = camera.position.distanceTo(_kissAt);

            // 얼굴을 보고 있는가. 뒷걸음질로 부딪힌 것은 아니어야 한다.
            _kissDir.copy(_kissAt).sub(camera.position).normalize();
            camera.getWorldDirection(_kissFwd);
            const facing = _kissDir.dot(_kissFwd);

            const aff = (typeof myAffinity === 'number') ? myAffinity : 0;
            const may = aff >= (k.wait_from || 0)
                && facing >= (typeof k.wait_facing === 'number'
                    ? k.wait_facing : 0.5);

            if (!kissWaiting) {
                // 말하는 중에는 눈을 안 감는다. 입 모양과 싸운다.
                if (may && dist < (k.wait_dist || 0.34)
                        && !isSpeaking() && !isWaitingForAI) {
                    kissWaiting = true;
                    faceUrgency = 1.4;

                    // 기다리는 사람은 걸어가지 않는다
                    if (roam.state === 'move') {
                        roam.state = 'idle';
                        roam.wait = 3.0;
                        playMotion('idle');
                    }

                    applyExpression(k.wait_expression || 'eyes_closed');
                }
                return;
            }

            // 나가는 거리를 들어오는 거리보다 넓게 잡는다.
            // 같으면 문턱에 걸쳐 눈을 감았다 떴다 한다.
            if (!may || dist > (k.leave_dist || 0.46)) endKissWait();
        }

        function endKissWait() {
            if (!kissWaiting) return;
            kissWaiting = false;

            // 말하는 중이면 그 얼굴이 이긴다. 여기서 지우면 안 된다.
            if (!isSpeaking() && !isWaitingForAI) applyExpression('neutral');
        }


        // ------------------------------------------------------------
        // 배
        //
        // 몸에 그런 모프가 없어서 뼈로 만든다. spine 을 가로·앞뒤로
        // 부풀리고 그 자식인 chest 를 같은 만큼 되돌린다 —
        // 안 되돌리면 가슴과 어깨까지 같이 불어난다.
        // 사이에 낀 배만 남는다.
        //
        // 두 벌을 겹쳐 쓰므로(layered) 몸 쪽에도 같이 걸어야 한다.
        // 옷만 부르고 몸이 그대로면 배가 옷을 뚫는다.
        // ------------------------------------------------------------

        let pregnant = false;        // 아이가 섰는가
        let bellyNow = 0;            // 지금 부른 정도 0~1
        let bellyWant = 0;           // 가려는 곳
        let bellyOverride = null;    // 시험 창이 밀고 있는 값

        function pregCfg() {
            return (ENTITY && ENTITY.pregnancy) || null;
        }

        function setPregnant(on, instant) {
            if (pregnant === !!on) return;
            pregnant = !!on;
            bellyWant = pregnant ? 1 : 0;
            if (instant) bellyNow = bellyWant;

            console.log('[diamondAI] ' + (pregnant ? '아이가 섰다' : '배를 되돌림'));
        }

        function applyBelly(vrm, k) {
            if (!vrm || !vrm.humanoid) return;

            let spine = null, chest = null;
            try {
                spine = vrm.humanoid.getBoneNode('spine');
                chest = vrm.humanoid.getBoneNode('chest');
            } catch (e) {}
            if (!spine) return;

            // 시험 창에서 밀고 있으면 그 값이 먼저다.
            // 개체가 가진 값은 그대로 두고 화면에서만 바꿔 본다 —
            // 눈으로 맞춘 뒤에 avatar.py 로 옮겨 적는다.
            const p = pregCfg();
            const to = bellyOverride || (p && p.spine_scale)
                || [1.30, 1.02, 1.55];

            const sx = 1 + (to[0] - 1) * k;
            const sy = 1 + (to[1] - 1) * k;
            const sz = 1 + (to[2] - 1) * k;

            spine.scale.set(sx, sy, sz);

            // 위쪽 몸을 같은 만큼 되돌린다.
            // 이게 없으면 가슴·어깨·머리까지 통째로 부푼다.
            if (chest) chest.scale.set(1 / sx, 1 / sy, 1 / sz);
        }

        function updateBelly(dt) {
            // 시험 창이 열려 있으면 값이 매 프레임 달라질 수 있으므로
            // 배가 0 이어도 계속 다시 그린다.
            if (!bellyOverride && bellyNow === bellyWant && bellyNow === 0) return;

            if (bellyNow !== bellyWant) {
                const p = pregCfg();
                const ms = (p && p.grow_ms) || 2600;
                const step = (dt * 1000) / Math.max(200, ms);
                bellyNow += Math.sign(bellyWant - bellyNow)
                    * Math.min(step, Math.abs(bellyWant - bellyNow));
            }

            applyBelly(currentVRM, bellyNow);
            applyBelly(bodyVRM, bellyNow);
        }


        function setFirstPerson(on) {
            user.on = on;
            controls.enabled = !on;
            userNoticed = false;

            if (on) {
                camFree = false;
            } else {
                // 걷지 않는 시점에서 조이스틱이 떠 있으면 눌러 봐도
                // 아무 일이 없어 고장으로 읽힌다. 같이 치운다.
                releaseStick();
                sitLatched = false;
                document.getElementById('stick-sit').classList.remove('on');

                camera.rotation.set(0, 0, 0);
                controls.target.set(0, LOOK_Y, 0);
                camera.position.set(0, CAM_Y, 1.65);
                controls.update();
            }

            stickPad.style.display = on ? '' : 'none';
            stickKeys.style.display = on ? '' : 'none';

            showHint(on ? '1인칭 — 조이스틱 · 방향키 · Shift 앉기 · 스페이스 점프'
                        : '둘러보기 시점 (F 로 되돌림)');
        }


        function resetCamera() {
            camFree = false;

            if (user.on) {
                user.x = 0; user.z = 1.65;
                user.yaw = Math.PI; user.pitch = 0;
                user.lift = 0; user.vy = 0;
                userNoticed = false;
                return;
            }

            controls.target.set(0, LOOK_Y, 0);
            camera.position.set(0, CAM_Y, 1.65);
            controls.update();
        }


        // ============================================================
        // 조이스틱
        //
        // 손잡이를 끌면 -1~1 두 축이 나온다. 이 축은 방향키와 같은
        // 자리로 들어가므로, 걷는 규칙은 한 군데에만 적혀 있다.
        // ============================================================

        const stickPad = document.getElementById('stick-pad');
        const stickKnob = document.getElementById('stick-knob');
        const stickKeys = document.getElementById('stick-keys');

        const STICK_R = 34;        // 손잡이가 벗어날 수 있는 거리(px)
        const STICK_DEAD = 0.14;   // 이 안쪽은 안 민 것으로 친다

        const stick = { on: false, x: 0, y: 0 };

        // 앉기 단추는 켜고 끄는 것이다(Shift 처럼 누르고 있을 수 없다)
        let sitLatched = false;

        function moveStick(e) {
            const r = stickPad.getBoundingClientRect();
            let dx = e.clientX - (r.left + r.width / 2);
            let dy = e.clientY - (r.top + r.height / 2);

            const d = Math.hypot(dx, dy);
            if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }

            stickKnob.style.transform =
                'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';

            // 화면은 아래로 갈수록 y 가 크다. 앞은 위쪽이므로 뒤집는다.
            stick.x = dx / STICK_R;
            stick.y = -dy / STICK_R;
        }

        function releaseStick() {
            stick.on = false;
            stick.x = 0;
            stick.y = 0;
            stickKnob.style.transform = '';
            stickPad.classList.remove('grabbed');
        }

        stickPad.addEventListener('pointerdown', (e) => {
            stick.on = true;
            stickPad.classList.add('grabbed');
            stickPad.setPointerCapture(e.pointerId);
            moveStick(e);
            e.preventDefault();
        });

        stickPad.addEventListener('pointermove', (e) => {
            if (stick.on) moveStick(e);
        });

        stickPad.addEventListener('pointerup', releaseStick);
        stickPad.addEventListener('pointercancel', releaseStick);

        // 창에서 눈을 떼면 손잡이가 밀린 채로 남아 혼자 걸어간다
        window.addEventListener('blur', releaseStick);

        document.getElementById('stick-sit').addEventListener('click', (e) => {
            sitLatched = !sitLatched;
            e.currentTarget.classList.toggle('on', sitLatched);
        });

        document.getElementById('stick-jump').addEventListener('click', () => {

        function loadAvatar(url) {

                    const bodyUrl = ENTITY && ENTITY.model

        function resetToAttentionPose() {

            if (
                !currentVRM ||
                !currentVRM.humanoid
            ) {
                return;
            }

            const humanoid =
                currentVRM.humanoid;

            try {

                    humanoid.getBoneNode(
                        'rightUpperArm'

                    leftArm.rotation.z = 1.2;

        // ============================================================
        // 아바타 개체
        //
        // 표정 수치와 동작을 이 파일이 들고 있지 않는다.
        // 서버의 /api/avatar 가 내려준 정의를 그대로 쓴다.
        // (테스트 화면 /test 와 완전히 같은 정의를 공유한다)
        // ============================================================

        let ENTITY = null;
        let ENTITY_SHAPES = [];

        const FALLBACK_SHAPES = {
            joy: { joy: 0.45 },
            fun: { fun: 0.8 },
            angry: { angry: 0.8 },
            sorrow: { sorrow: 0.8 },
            neutral: {}
        };

        async function loadEntity() {
            try {
                const res = await fetch('/api/avatar');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                ENTITY = await res.json();

                const set = {};
                ENTITY.expressions.forEach(e => {
                    Object.keys(e.blendshapes || {}).forEach(n => set[n] = 1);
                    Object.keys(e.fallback_blendshapes || {}).forEach(n => set[n] = 1);
                });
                ENTITY_SHAPES = Object.keys(set);

                cacheBones();
                console.log('[diamondAI] 개체 로드: 표정 '
                    + ENTITY.expressions.length + '종, 동작 '
                    + ENTITY.motions.length + '종');
            } catch (e) {
                console.warn('[diamondAI] 개체를 불러오지 못해 기본값으로 동작합니다.', e);
            }
        }


        // ------------------------------------------------------------
        // 배경
        //
        // static/background/ 에 이미지를 넣어 두면 아바타 뒤에 깔린다.
        // 파일 이름을 이 파일에 적지 않는다 — 서버가 폴더를 훑어 알려주므로,
        // 이미지를 바꿔 넣고 새로 고치기만 하면 된다.
        //
        // 3D 는 캔버스에 그리고 배경은 CSS 로 깐다. scene.background 로 넣으면
        // 창 비율에 따라 그림이 늘어나는데, CSS 는 잘라 넣어 주기 때문이다.
        // ------------------------------------------------------------

        const backgrounds = { list: [], at: 0 };

        function paintBackground(img, fit, dim) {
            const box = document.getElementById('avatar-container');
            if (!box) return;

            if (!img) {
                box.style.backgroundImage = '';
                return;
            }

            const veil = Math.max(0, Math.min(1, dim || 0));
            const shade = 'linear-gradient(rgba(0,0,0,' + veil + '), '
                + 'rgba(0,0,0,' + veil + '))';

            box.style.backgroundImage = shade + ', url("' + img.url + '")';
            box.style.backgroundSize = 'auto, ' + (fit || 'cover');
            box.style.backgroundPosition = 'center, center';
            box.style.backgroundRepeat = 'no-repeat, no-repeat';
        }

        async function loadBackground() {
            try {
                const res = await fetch('/api/background');
                if (!res.ok) throw new Error('HTTP ' + res.status);

                const d = await res.json();
                backgrounds.list = d.images || [];
                backgrounds.fit = d.fit;
                backgrounds.dim = d.dim;

                if (!d.current) {
                    console.log('[diamondAI] ' + d.folder
                        + ' 에 배경 이미지가 없습니다. 넣으면 바로 깔립니다.');
                    return;
                }

                backgrounds.at = backgrounds.list
                    .findIndex(i => i.url === d.current.url);
                if (backgrounds.at < 0) backgrounds.at = 0;

                paintBackground(d.current, d.fit, d.dim);
                console.log('[diamondAI] 배경: ' + d.current.name
                    + ' (총 ' + backgrounds.list.length + '장)');

            } catch (e) {
                console.warn('[diamondAI] 배경을 불러오지 못했습니다.', e);
            }
        }

        // 여러 장 넣었을 때 다음 장으로 넘긴다.
        function nextBackground() {
            if (backgrounds.list.length < 2) return null;
            backgrounds.at = (backgrounds.at + 1) % backgrounds.list.length;
            const img = backgrounds.list[backgrounds.at];
            paintBackground(img, backgrounds.fit, backgrounds.dim);
            return img;
        }

        // ------------------------------------------------------------
        // 모프 타깃을 직접 건드리기
        //
        // VRM 이 내주는 표정 그룹은 14개뿐인데 얼굴 메시에는 57개가 있다.
        // 남은 것들은 눈썹·눈·입을 따로 움직이는 조각이라, 직접 쓰면
        // 그룹만으로는 못 만드는 얼굴을 만들 수 있다.
        // (눈 하이라이트를 지우는 것 같은)
        // ------------------------------------------------------------

        const morphSlots = {};      // 이름 -> [{mesh, index}, ...]

        function buildMorphs() {
            Object.keys(morphSlots).forEach(k => delete morphSlots[k]);
            if (!currentVRM) return;

            currentVRM.scene.traverse(o => {
                if (!o.morphTargetDictionary || !o.morphTargetInfluences) return;
                Object.keys(o.morphTargetDictionary).forEach(name => {
                    (morphSlots[name] = morphSlots[name] || []).push({
                        mesh: o,
                        index: o.morphTargetDictionary[name]
                    });
                });
            });

            console.log('[diamondAI] 모프 타깃 '
                + Object.keys(morphSlots).length + '개');
        }

        function setMorph(name, value) {
            const slots = morphSlots[name];
            if (!slots) return false;
            slots.forEach(s => s.mesh.morphTargetInfluences[s.index] = value);
            return true;
        }

        function clearMorphs() {
            // 표정이 쓰는 것만 되돌린다. 입모양(립싱크)까지 지우면 안 된다.
            ((ENTITY && ENTITY.expressions) || []).forEach(e => {
                Object.keys(e.morphs || {}).forEach(n => setMorph(n, 0));
            });
        }

        function entityMorphsFor(key) {
            if (!ENTITY) return null;
            const e = ENTITY.expressions.find(x => x.key === key);
            return (e && e.morphs) || null;
        }


        function entityShapesFor(key) {
            if (!ENTITY) return FALLBACK_SHAPES[key] || null;
            const e = ENTITY.expressions.find(x => x.key === key);
            if (!e) return FALLBACK_SHAPES[key] || null;
            if (e.auto_detect) {
                if (surprisedBlendShapeName) {
                    const o = {};
                    o[surprisedBlendShapeName] = e.auto_weight;
                    return o;
                }
                return e.fallback_blendshapes || {};
            }
            return e.blendshapes || {};
        }


        // ============================================================
        // 동작 재생기
        //
        // 클립은 절대 자세로 적혀 있고,
        // 클립이 언급하지 않은 본은 base_pose 를 쓴다.
        // ============================================================

        const MOTION_BONES = [
            'hips', 'spine', 'chest', 'upperChest', 'neck', 'head',
            'leftShoulder', 'leftUpperArm', 'leftLowerArm', 'leftHand',
            'rightShoulder', 'rightUpperArm', 'rightLowerArm', 'rightHand',
            'leftUpperLeg', 'leftLowerLeg', 'leftFoot',
            'rightUpperLeg', 'rightLowerLeg', 'rightFoot'
        ];

        // 손가락도 자세를 받아야 한다.
        // 여기 없으면 개체가 정한 손 모양이 화면에 닿지 못해,
        // 손이 T포즈 그대로 판자처럼 쫙 펴진 채로 남는다.
        ['left', 'right'].forEach(side => {
            ['Thumb', 'Index', 'Middle', 'Ring', 'Little'].forEach(finger => {
                ['Proximal', 'Intermediate', 'Distal'].forEach(joint => {
                    MOTION_BONES.push(side + finger + joint);
                });
            });
        });

        let boneNodes = {};
        let boneNodesBody = {};   // 겹쳐 놓은 몸(표현용)의 같은 뼈
        const DEG = Math.PI / 180;

        const EASE = {
            linear: u => u,
            easeIn: u => u * u,
            easeOut: u => 1 - (1 - u) * (1 - u),
            easeInOut: u => u * u * (3 - 2 * u)
        };

        const player = {
            motion: null, time: 0, done: true,
            from: null, blend: 1, blendDur: 0.22
        };

        // 동작이 정한 머리 각도. 숨쉬기 흔들림은 이 값 '위에' 얹는다.
        // 덮어쓰면 끄덕임 같은 머리 동작이 화면에서 지워진다.
        let poseHeadX = 0;

        function cacheBones() {
            boneNodes = {};
            boneNodesBody = {};
            if (!currentVRM || !currentVRM.humanoid) return;
            MOTION_BONES.forEach(n => {
                let node = null;
                try { node = currentVRM.humanoid.getBoneNode(n); } catch (e) {}
                if (node) boneNodes[n] = node;

                // 겹쳐 놓은 몸에도 같은 자세를 준다. 뼈대가 같아서 그대로 먹는다.
                if (bodyVRM && bodyVRM.humanoid) {
                    let b = null;
                    try { b = bodyVRM.humanoid.getBoneNode(n); } catch (e) {}
                    if (b) boneNodesBody[n] = b;
                }
            });
        }

        function expressionByKey(key) {
            return ((ENTITY && ENTITY.expressions) || [])
                .find(e => e.key === key) || null;
        }

        function motionByKey(k) {
            if (!ENTITY) return null;
            return ENTITY.motions.find(m => m.key === k) || null;
        }

        function basePose() {
            return (ENTITY && ENTITY.base_pose) ? ENTITY.base_pose : {};
        }

        function samplePose(m, t) {
            const base = basePose();
            const pose = {};
            Object.keys(base).forEach(n => pose[n] = base[n].slice());

            const keys = m.keys;
            let a = keys[0], b = keys[0], u = 0;

            if (t <= keys[0].t) { a = b = keys[0]; }
            else if (t >= keys[keys.length - 1].t) { a = b = keys[keys.length - 1]; }
            else {
                for (let i = 0; i < keys.length - 1; i++) {
                    if (t >= keys[i].t && t < keys[i + 1].t) {
                        a = keys[i]; b = keys[i + 1];
                        u = (t - a.t) / (b.t - a.t);
                        break;
                    }
                }
            }

            const e = (EASE[m.ease] || EASE.easeInOut)(u);

            m.channels.forEach(n => {
                const bs = base[n] || [0, 0, 0];
                const ra = (a.bones && a.bones[n]) || bs;
                const rb = (b.bones && b.bones[n]) || bs;
                pose[n] = [
                    ra[0] + (rb[0] - ra[0]) * e,
                    ra[1] + (rb[1] - ra[1]) * e,
                    ra[2] + (rb[2] - ra[2]) * e
                ];
            });
            return pose;
        }

        function currentPose() {
            if (!player.motion) {
                const base = basePose(), p = {};
                Object.keys(base).forEach(n => p[n] = base[n].slice());
                return p;
            }
            return samplePose(player.motion, player.time);
        }

        let motionFaceTimer = null;

        function playMotion(key, opts) {
            // 등을 돌리거나 팔짱을 끼는 일이 없어지는 단계가 있다.
            key = swapNegative('motions', key);

            const m = motionByKey(key);
            if (!m) return;
            player.from = currentPose();
            player.blend = 0;
            player.motion = m;
            player.time = 0;
            player.done = false;

            // 그 자세로 얼마나 서 있을지. 부르는 쪽이 정할 수 있고,
            // 없으면 동작이 스스로 들고 있는 값을 쓴다.
            player.lingerLeft = (opts && typeof opts.linger_ms === 'number')
                ? opts.linger_ms
                : (m.linger_ms || 0);

            // 동작이 함께 지을 표정을 정해 뒀다면 그것도 같이 짓는다.
            // 쑥스러워하기에 놀란 표정이 늘 따라붙는 것이 이 자리다.
            // (idle·walk 처럼 표정을 정하지 않은 동작은 얼굴을 건드리지 않는다)
            //
            // 다만 이미 어울리는 얼굴이면 덮어쓰지 않는다.
            // 팔짱과 등 돌리기는 삐죽만의 몸짓이 아니다 — 화나서 팔짱을
            // 끼기도 하고 서운해서 등을 돌리기도 한다. 그때까지 삐죽으로
            // 바꿔 버리면 화난 말끝에 삐친 얼굴이 나온다.
            if (motionFaceTimer) {
                clearTimeout(motionFaceTimer);
                motionFaceTimer = null;
            }

            // 말끝에 딸려 나온 몸짓은 얼굴을 건드리지 않는다.
            //
            // "조금 쑥스럽네요" 하면서 몸을 움츠릴 수는 있어도, 그때 얼굴까지
            // 놀란 얼굴로 바뀌지는 않는다. 사람은 쑥스럽다고 말하면서 웃는다.
            // 얼굴은 그 문장의 감정이 정하고, 몸짓만 얹는 것이 맞다.
            //
            // 만져서 놀란 것은 다르다. 그건 정말로 놀란 것이라 얼굴이 같이 간다.
            const spoken = !!(opts && opts.spoken);

            if (m.expression && !spoken) {

                // 이미 지어진 얼굴이 있으면 동작은 얼굴을 건드리지 않는다.
                //
                // 팔짱과 등 돌리기는 삐죽만의 몸짓이 아니다 — 화나서 팔짱을
                // 끼기도 하고 서운해서 등을 돌리기도 한다. 반대로 삐죽은
                // 이 두 몸짓과만 같이 나온다. 규칙 하나로 둘 다 된다.
                // 만졌을 때도 자리가 정한 얼굴이 늘 이긴다.
                //
                // 다만 얼굴이 곧 그 동작인 몸짓은 예외다. 쑥스러워하기와
                // 얼굴 가리기는 놀란 얼굴과 한 몸이라, 웃으면서 하면
                // 무엇을 하는 건지 알 수 없게 된다.
                const bare = !currentExpression || currentExpression === 'neutral';

                if (bare || m.expression_force) {

                    // 데려온 얼굴은 데려간 쪽이 치운다.
                    //
                    // 예전에는 치우는 데가 없어서, 손을 내린 뒤에도 놀란
                    // 얼굴이 다음 무언가가 덮을 때까지 그대로 남아 있었다.
                    // 되돌릴 곳은 평온이 아니라 '동작 전에 짓고 있던 얼굴'
                    // 이다 — 말하는 중이면 그 말의 얼굴로 돌아가야 한다.
                    const before = currentExpression || 'neutral';

                    applyExpression(m.expression);

                    const ms = (typeof m.expression_ms === 'number')
                        ? m.expression_ms
                        : (m.duration || 0) * 1000;

                    if (ms > 0) {
                        motionFaceTimer = setTimeout(() => {
                            motionFaceTimer = null;
                            // 그 사이 다른 얼굴로 바뀌었으면 건드리지 않는다
                            if (currentExpression === m.expression) {
                                applyExpression(before);
                            }
                        }, ms);
                    }
                }
            }
        }

        function updateMotion(dt) {
            if (!currentVRM) return;

            if (!player.motion) {
                const b = basePose()['head'];
                poseHeadX = b ? b[0] * DEG : 0;
                return;
            }

            // 마음이 큰 만큼 그 자세로 더 서 있는다.
            //
            // 등을 돌린 채 얼마나 있을지는 서운함의 크기가 정한다.
            // 마음마다 키프레임을 새로 만들 수는 없으니, 가장 오래
            // 머무는 지점(hold_t)에서 재생을 그만큼 세워 둔다.
            const holdT = player.motion.hold_t;
            const linger = player.lingerLeft || 0;

            if (typeof holdT === 'number' && linger > 0
                && player.time >= holdT) {

                player.lingerLeft = linger - dt * 1000;
                player.time = holdT;

            } else {
                player.time += dt;
            }

            if (player.time >= player.motion.duration) {
                if (player.motion.loop) {
                    player.time = player.time % player.motion.duration;
                } else {
                    player.time = player.motion.duration;
                    player.done = true;
                }
            }
            if (player.blend < 1) {
                player.blend = Math.min(1, player.blend + dt / player.blendDur);
            }

            let pose = samplePose(player.motion, player.time);

            if (player.from && player.blend < 1) {
                const w = EASE.easeInOut(player.blend);
                const base = basePose();
                const names = {};
                Object.keys(pose).forEach(n => names[n] = 1);
                Object.keys(player.from).forEach(n => names[n] = 1);
                const out = {};
                Object.keys(names).forEach(n => {
                    const bs = base[n] || [0, 0, 0];
                    const f = player.from[n] || bs, tg = pose[n] || bs;
                    out[n] = [
                        f[0] + (tg[0] - f[0]) * w,
                        f[1] + (tg[1] - f[1]) * w,
                        f[2] + (tg[2] - f[2]) * w
                    ];
                });
                pose = out;
            }

            const base = basePose();
            Object.keys(base).forEach(n => { if (!(n in pose)) pose[n] = base[n]; });

            Object.keys(pose).forEach(n => {
                const r = pose[n];
                const node = boneNodes[n];
                if (node) node.rotation.set(r[0] * DEG, r[1] * DEG, r[2] * DEG);

                // 겹쳐 놓은 몸도 같이 움직여야 한다.
                // 한쪽만 주면 옷과 몸이 따로 논다.
                const b = boneNodesBody[n];
                if (b) b.rotation.set(r[0] * DEG, r[1] * DEG, r[2] * DEG);
            });

            poseHeadX = pose['head'] ? pose['head'][0] * DEG : 0;

            // 몸 전체가 도는 동작(등 돌리기)은 뼈로 못 만든다.
            // 척추를 150도 비트는 사람은 없다. 그래서 여기서 통째로 돌린다.
            // 돌았다가 제자리로 돌아오도록 종 모양으로 오르내린다.
            if (player.motion.turn_yaw) {
                const u = player.time / player.motion.duration;
                const bell = Math.sin(Math.min(1, Math.max(0, u)) * Math.PI);
                roam.yaw = player.motion.turn_yaw * DEG
                    * EASE.easeInOut(bell);
            }
        }


        // ============================================================
        // 돌아다니기
        // ============================================================

        const roam = {
            on: false, state: 'idle',
            x: 0, z: 0, yaw: 0, targetX: 0, targetZ: 0,
            wait: 0, phase: 0,
            following: false        // 상대를 따라가는 중인가
        };

        function loco() {
            return (ENTITY && ENTITY.locomotion) ? ENTITY.locomotion : null;
        }

        // 0보다 크면 그 시간 동안 이쪽으로 빠르게 돌아선다
        let faceUrgency = 0;

        // 0보다 크면 그 시간 동안 고개를 돌린 채로 둔다.
        // 입을 닫았을 때 쓴다 — 안 그러면 돌아서자마자 다시 이쪽을 봐서
        // 외면한 티가 나지 않는다.
        let sulkTimer = 0;

        // 돌아다녀도 되는가.
        //
        // 대화 중에 혼자 걸어 다니면 이야기하다 말고 떠나는 꼴이 된다.
        // 그래서 기본은 제자리다. 한동안 조용해서 다이아가 먼저 말을 건
        // 뒤부터 돌아다니고, 상대가 다시 말을 걸면 멈춘다.
        let mayRoam = false;

        function faceUser() {
            // 말을 걸었으면 걷던 것을 멈춘다. 등을 돌린 채 대답하면 어색하다.
            if (roam.state === 'move') {
                roam.state = 'idle';
                roam.wait = 2.5;
                playMotion('idle');
            }
            faceUrgency = 1.4;

            // 이야기가 시작됐으니 다시 조용해질 때까지는 제자리에 있는다.
            // 다만 같이 걷는 중이라면 발을 묶지 않는다 —
            // 산책하면서 말도 하는 것이 자연스럽다.
            if (!walking) mayRoam = false;
        }


        // 같이 걷는 중인가.
        //
        // 평소에는 제자리에 서 있다가, "산책하자" 같은 말이 나오면
        // 발이 풀린다. "그만 걷자" 하면 멈추고 이쪽을 본다.
        let walking = false;

        function setWalking(on) {
            if (walking === on) return;
            walking = on;
            mayRoam = on;

            if (on) {
                // 곧바로 걷기 시작한다. 기다릴 이유가 없다.
                roam.wait = 0;
                console.log('[diamondAI] 같이 걷기 시작');
            } else {
                if (roam.state === 'move') {
                    roam.state = 'idle';
                    roam.wait = 2.0;
                    playMotion('idle');
                }
                faceUrgency = 1.4;
                console.log('[diamondAI] 걷기 멈춤');
            }
        }

        function angleDiff(a, b) {
            let d = (b - a) % (Math.PI * 2);
            if (d > Math.PI) d -= Math.PI * 2;
            if (d < -Math.PI) d += Math.PI * 2;
            return d;
        }

        function pickRoamTarget() {
            const L = loco();
            // 대화 화면은 카메라가 가까우므로 좁게 움직인다
            const radius = Math.min(L.roam_radius, 0.75);
            for (let i = 0; i < 12; i++) {
                const ang = Math.random() * Math.PI * 2;
                const r = radius * (0.4 + Math.random() * 0.6);
                const tx = Math.cos(ang) * r, tz = Math.sin(ang) * r * 0.5;
                if (Math.hypot(tx - roam.x, tz - roam.z) > 0.25) {
                    roam.targetX = tx; roam.targetZ = tz; return;
                }
            }
            roam.targetX = 0; roam.targetZ = 0;
        }

        function updateRoam(dt) {
            const L = loco();
            if (!currentVRM || !L) return;

            // 자거나 말하는 중에는 돌아다니지 않는다
            if (isSleeping || lipSyncTimer || isWaitingForAI) {
                if (roam.state === 'move') {
                    roam.state = 'idle';
                    roam.wait = 3;
                    playMotion('idle');
                }
            } else if (roam.state === 'gesture') {
                if (player.done) {
                    roam.state = 'idle';
                    roam.wait = 2 + Math.random() * 4;
                    playMotion('idle');
                }
            } else if (roam.state === 'idle') {
                roam.wait -= dt;

                // 상대가 멀어졌으면 그것부터다.
                //
                // 따라가기는 혼자 돌아다니기와 다르다. mayRoam 도
                // roam_enabled 도 안 본다 — 두고 가면 따라나서는 것은
                // 심심해서 걷는 것과 다른 일이기 때문이다.
                // 다만 자거나 말하는 중이면 위쪽 갈래가 먼저 잡아
                // 여기까지 오지 않는다. 말을 마친 뒤에 따라나선다.
                if (!startFollow()) {

                    // 아직 돌아다닐 때가 아니면 제자리에 둔다.
                    // 개체가 아예 꺼 뒀거나(roam_enabled), 대화 중이면 안 움직인다.
                    if (!mayRoam || !L.roam_enabled) roam.wait = 1.0;

                    if (roam.wait <= 0) {
                        pickRoamTarget();
                        roam.state = 'move';
                        playMotion('walk');
                    }
                }
            } else if (roam.state === 'move') {
                // 따라가는 중이면 목적지가 상대를 좇아 움직인다
                if (roam.following) trackUser();

                const dx = roam.targetX - roam.x, dz = roam.targetZ - roam.z;
                const dist = Math.hypot(dx, dz);
                if (dist <= L.arrive_dist) {
                    roam.state = 'idle';
                    roam.following = false;
                    roam.wait = 4 + Math.random() * 6;
                    playMotion('idle');
                } else {
                    const want = Math.atan2(dx, dz);
                    const diff = angleDiff(roam.yaw, want);
                    roam.yaw += Math.max(-L.turn_speed * dt,
                        Math.min(L.turn_speed * dt, diff));
                    const align = Math.max(0, Math.cos(angleDiff(roam.yaw, want)));

                    // 따라갈 때는 걸음이 빨라진다. 평소 속도(0.42m/s)로는
                    // 걸어가는 사람을 영영 못 따라잡는다.
                    // 걸음 주기도 같은 배수로 빨라져야 발이 더 미끄러지지 않는다.
                    const mul = roam.following
                        ? followCfg('follow_speed_mul', 1.6) : 1;

                    const step = Math.min(L.walk_speed * mul * dt * align, dist);
                    roam.x += Math.sin(roam.yaw) * step;
                    roam.z += Math.cos(roam.yaw) * step;
                    roam.phase += dt * mul /
                        (player.motion ? player.motion.duration : 1);
                }
            }

            // 걷는 중이 아니면 늘 이쪽을 향해 돌아선다.
            // 말을 걸었을 때는 한동안 훨씬 빠르게 돈다. 하던 걸 멈추고
            // 바로 이쪽을 보는 것이 자연스럽다.
            // 몸을 돌리는 동작이 재생 중이면 그 동작이 방향을 쥔다.
            // 여기서 같이 돌리면 서로 밀친다.
            const turning = player.motion && player.motion.turn_yaw;

            if (roam.state !== 'move' && !turning) {
                if (sulkTimer > 0) {
                    // 외면하는 중이다. 이쪽으로 돌리지 않는다.
                    sulkTimer -= dt;
                } else {
                    const sp = L.turn_speed * (faceUrgency > 0 ? 5.0 : 1);
                    // 예전에는 늘 정면(0)을 봤다. 이제는 상대가 서 있는
                    // 자리를 본다 — 옆으로 돌아가면 고개도 따라온다.
                    roam.yaw += Math.max(-sp * dt,
                        Math.min(sp * dt, angleDiff(roam.yaw, yawToUser())));
                }
            }

            if (faceUrgency > 0) faceUrgency -= dt;

            const bob = (roam.state === 'move')
                ? Math.abs(Math.sin(roam.phase * Math.PI * 2)) * L.bob_height : 0;

            currentVRM.scene.position.set(roam.x, L.ground_y + bob, roam.z);
            currentVRM.scene.rotation.y = Math.PI + roam.yaw;

            if (bodyVRM) {
                bodyVRM.scene.position.copy(currentVRM.scene.position);
                bodyVRM.scene.rotation.y = currentVRM.scene.rotation.y;
            }

            if (floorGrid) floorGrid.position.y = L.ground_y;

            if (footShadow) {
                footShadow.position.set(roam.x, L.ground_y + 0.004, roam.z);
                // 걸을 때 살짝 뜨면 그림자도 옅어진다
                footShadow.material.opacity = 1 - Math.min(0.35, bob * 12);
            }

            // 1인칭에서는 카메라가 상대의 눈이다. 여기서 건드리면 안 된다.
            if (user.on) return;

            // 사람이 시점을 잡았으면 카메라는 건드리지 않는다.
            // 돌려 놓은 것을 자동으로 되돌리면 서로 싸운다.
            if (camFree) {
                controls.target.lerp(
                    new THREE.Vector3(roam.x * 0.8, LOOK_Y, roam.z * 0.5),
                    Math.min(1, dt * 1.2)
                );
                return;
            }

            // 아직 아무도 안 잡았으면 살짝 따라가 화면 밖으로 나가지 않게 한다
            camera.position.x += (roam.x * 0.55 - camera.position.x) * Math.min(1, dt * 2.5);
            const back = (roam.state === 'move') ? 0.45 : 0;
            const wantZ = 1.65 + back;
            camera.position.z += (wantZ - camera.position.z) * Math.min(1, dt * 1.6);
            camera.lookAt(roam.x * 0.8, LOOK_Y, roam.z * 0.5);
            controls.target.set(roam.x * 0.8, LOOK_Y, roam.z * 0.5);
        }


        // ============================================================
        // 서버가 걷어낸 표시를 그 자리에서 되살린다
        // ============================================================

        let cueTimers = [];

        function playCues(cues, baseFace, replyLen) {
            cueTimers.forEach(clearTimeout);
            cueTimers = [];
            if (!cues || !cues.length || !ENTITY) return;

            const tick = ENTITY.behavior.lipsync_tick_ms || 100;
            const home = baseFace || 'neutral';
            const total = (replyLen || 0) * tick;

            // 몸짓이 앞뒤로 붙으면 뭉개진다. 앞 몸짓이 끝날 즈음으로 민다.
            let freeAt = 0;

            cues.forEach((c, idx) => {

                const at = (c.at || 0) * tick;

                if (c.type === 'expression') {

                    // 이 얼굴을 언제까지 지을지.
                    //
                    // 다음 표시가 있으면 거기까지, 없으면 말이 끝날 때까지다.
                    // 정해 둔 유지 시간보다 짧아지지는 않게 한다.
                    let until = total - at;
                    for (let k = idx + 1; k < cues.length; k++) {
                        if (cues[k].type !== 'expression') continue;
                        until = (cues[k].at || 0) * tick - at;
                        break;
                    }

                    const ms = Math.max(c.hold_ms || 3000, Math.min(until, 8000));

                    cueTimers.push(setTimeout(() => {
                        applyExpression(c.key);

                        if (window.expressionChangeTimer) {
                            clearTimeout(window.expressionChangeTimer);
                        }
                        window.expressionChangeTimer = setTimeout(() => {
                            // 평온이 아니라 이 답변의 얼굴로 돌아간다
                            applyExpression(home);
                        }, ms);
                    }, at));

                    return;
                }

                if (c.type === 'motion' && roam.state !== 'move') {

                    const m = motionByKey(c.key);
                    const span = ((m ? m.duration : 2.2) * 1000)
                        + (c.linger_ms || 0);

                    // 앞 몸짓이 아직 도는 중이면 그 뒤로 민다
                    const when = Math.max(at, freeAt);
                    freeAt = when + span;

                    cueTimers.push(setTimeout(() => {
                        roam.state = 'gesture';
                        playMotion(c.key, {
                            spoken: true,
                            linger_ms: c.linger_ms,
                        });

                        // 세기가 실려 온 몸짓은 얼굴도 같이 짓는다.
                        // 몸짓과 얼굴이 같이 시작해 같이 끝나야 한다.
                        if (c.face) {
                            applyExpression(c.face);

                            if (window.expressionChangeTimer) {
                                clearTimeout(window.expressionChangeTimer);
                            }
                            window.expressionChangeTimer = setTimeout(() => {
                                applyExpression(home);
                            }, span);
                        }
                    }, when));
                }
            });
        }


        // ============================================================
        // 지금 어떤 사이이고 어떤 기분인지 보여주기
        //
        // 단계 경계와 표정 이름은 개체가 가지고 있다.
        // 여기서는 받아서 그리기만 한다.
        // ============================================================

        const stageLabelEl = document.getElementById('stage-label');
        const affinityNumEl = document.getElementById('affinity-num');
        const affinityFill = document.getElementById('affinity-fill');
        const affinityKnob = document.getElementById('affinity-knob');
        const affinityMarks = document.getElementById('affinity-marks');
        const affinityPop = document.getElementById('affinity-pop');
        const moodDot = document.getElementById('mood-dot');
        const moodLabel = document.getElementById('mood-label');
        const moodBars = document.getElementById('mood-bars');

        // 표정마다 색을 준다. 이름만으로는 한눈에 안 들어온다.
        const MOOD_COLOR = {
            neutral: '#8f93b8',
            joy: '#f0c86a',
            fun: '#86e08a',
            sorrow: '#6fa8dc',
            angry: '#ff7b7b',
            surprised: '#c58ae0'
        };

        let affinityShown = null;

        // 상한(330)을 넘어 쌓인 마음. 100점이 모여야 1이 된다.
        const myDevotion = { level: 0, raw: 0, label: null };

        // 지금 얼마나 상해 있는가.
        //
        // 사이(단계)와는 다르다. 사이가 좋아도 방금 심한 말을 들었으면
        // 상해 있다. 쓰다듬으면 풀리고, 시간이 지나도 저절로 풀린다.
        const myMood = { level: 0, label: null, expression: null };

        // 연인인가.
        //
        // 사이(단계)와 다르다. 사이는 마음이 얼마나 깊은지고,
        // 이건 그 마음을 서로 말로 확인했는지다.
        // 연인이 되기 전에는 호감이 광기 앞에서 멈춘다.
        const myLover = { yes: false, ceiling: null };

        // 지금 단계에 늘 걸려 있는 얼굴
        function stageMorphs() {
            const s = stageList().find(x => x.key === myStageKey);
            return (s && s.morphs) || {};
        }

        function stageList() {
            return (ENTITY && ENTITY.relationship && ENTITY.relationship.stages)
                || [];
        }

        function curStage() {
            return stageList().find(x => x.key === myStageKey) || null;
        }

        // 부정적인 표현이 사라지는 단계에서 무엇으로 바꿔 낼지.
        //
        // 얀데레가 그렇다. 화를 참는 게 아니라 화가 날 일이 없어진 것이라
        // 화난 얼굴을 지우는 대신 웃는 얼굴로 갈아 끼운다.
        // 눈에는 이미 빛이 없으니(stageMorphs) 웃는 얼굴이 더 서늘하다.
        function swapNegative(kind, key) {
            if (!key) return key;
            const s = curStage();
            if (!s || !s.no_negative) return key;

            const tbl = (ENTITY.relationship.no_negative || {})[kind] || {};
            const to = tbl[key];
            if (!to || to === key) return key;

            console.log('[diamondAI] ' + s.label + ' — ' + kind + ' '
                + key + ' -> ' + to);
            return to;
        }

        function affinityRange() {
            const st = stageList();
            if (!st.length) return [-100, 120];

            const lo = st[0].min_affinity;
            const last = st[st.length - 1].min_affinity;

            // 마지막 단계도 눈금 안에서 자리를 갖도록 여유를 준다.
            // 친밀도 상한이 열려 있어 지금 값이 더 클 수도 있으므로 그것도 본다.
            let hi = last + Math.max(20, Math.round((last - lo) * 0.15));
            if (typeof myAffinity === 'number') {
                hi = Math.max(hi, myAffinity + 10);
            }
            return [lo, hi];
        }

        function buildAffinityMarks() {
            const [lo, hi] = affinityRange();
            affinityMarks.innerHTML = '';

            stageList().forEach(s => {
                if (s.min_affinity <= lo) return;
                const i = document.createElement('i');
                i.style.left = ((s.min_affinity - lo) / (hi - lo) * 100) + '%';
                i.title = s.label + ' ' + s.min_affinity;
                affinityMarks.appendChild(i);
            });
        }

        function setAffinity(value, label) {
            if (typeof value !== 'number') return;

            const [lo, hi] = affinityRange();
            const pct = Math.max(0, Math.min(100, (value - lo) / (hi - lo) * 100));

            affinityFill.style.width = pct + '%';
            affinityKnob.style.left = pct + '%';
            affinityNumEl.textContent = value;

            // 눈금이 꽉 찬 뒤로도 쌓이는 마음이 있다.
            // 눈금은 그대로 두고 이름표 옆에 조용히 적는다.
            if (label) {
                let t = myDevotion.level > 0
                    ? label + ' · 순종 ' + myDevotion.level
                      + (myDevotion.label ? ' (' + myDevotion.label + ')' : '')
                    : label;

                // 연인이면 그렇게 적는다
                if (myLover.yes) t += ' · 연인';

                // 연인이 아닌데 천장에 닿았으면 왜 안 오르는지 알려준다
                else if (myLover.ceiling !== null
                         && value >= myLover.ceiling) {
                    t += ' · 여기서 멈춤 (고백이 필요하다)';
                }

                // 상해 있으면 그것도 적는다. 사이와 기분은 다른 것이다.
                if (myMood.level > 0 && myMood.label) {
                    t += ' · 기분 ' + myMood.label;
                }

                stageLabelEl.textContent = t;
            }

            if (affinityShown !== null && value !== affinityShown) {
                showAffinityPop(value - affinityShown);
            }
            affinityShown = value;

            updateTouchZones();
        }

        function showAffinityPop(delta) {
            if (!delta) return;
            affinityPop.textContent = (delta > 0 ? '+' : '') + delta;
            affinityPop.className = delta > 0 ? 'up' : 'down';
            // 애니메이션을 다시 태우려면 한 번 지웠다 붙여야 한다
            void affinityPop.offsetWidth;
            affinityPop.classList.add('show');
            setTimeout(() => affinityPop.classList.remove('show'), 1400);
        }

        function buildMoodBars() {
            moodBars.innerHTML = '';
            const list = (ENTITY && ENTITY.expressions) || [];
            // 윙크나 눈 감기는 기분이 아니라 눈 상태다. 여기 섞으면 헷갈린다.
            list.filter(e => e.key !== 'neutral' && e.is_reply_emotion !== false)
                .forEach(e => {
                const m = document.createElement('div');
                m.className = 'm';
                m.dataset.key = e.key;
                m.title = e.label;
                moodBars.appendChild(m);
            });
        }

        function setMood(key) {
            const list = (ENTITY && ENTITY.expressions) || [];
            const found = list.find(e => e.key === key);
            const color = MOOD_COLOR[key] || '#8f93b8';

            moodDot.style.background = color;
            moodLabel.textContent = found ? found.label : (key || '평온');

            moodBars.querySelectorAll('.m').forEach(m => {
                const on = m.dataset.key === key;
                m.style.background = on ? (MOOD_COLOR[m.dataset.key] || '#8f93b8')
                                        : '#262a4a';
                m.style.opacity = on ? '1' : '0.5';
            });
        }

        // ------------------------------------------------------------
        // 대답하지 않을 때
        //
        // 사이가 바닥까지 떨어지면 다이아는 입을 닫는다.
        // 서버가 모델을 아예 부르지 않으므로 할 말 자체가 없다.
        // 화면은 그걸 '고장'이 아니라 '침묵'으로 보여줘야 한다.
        // ------------------------------------------------------------

        function silenceCfg() {
            return (ENTITY && ENTITY.relationship
                && ENTITY.relationship.silence) || {};
        }

        function showSilence(expression) {
            const conf = silenceCfg();

            // 대화창에는 아무것도 남기지 않는다.
            // 말풍선의 점과 돌아선 몸이면 충분하다 —
            // '(대답이 없다)'라고 굳이 적으면 설명하는 꼴이 된다.
            applyExpression(expression || 'angry');

            // 말풍선에는 점만 잠깐 띄운다. 립싱크는 하지 않는다.
            speechBubble.innerText = conf.note || '…';
            speechBubble.style.display = 'block';

            if (bubbleHideTimer) clearTimeout(bubbleHideTimer);
            bubbleHideTimer = setTimeout(() => {
                speechBubble.style.display = 'none';
            }, 1800);

            // 고개를 돌려 버린다. 잠시 그대로 둔다.
            roam.state = 'idle';
            roam.wait = 5;
            faceUrgency = 0;
            sulkTimer = 5;
            roam.yaw = 0.55;
            playMotion('idle');

            startInactivityTimers();
        }


        // 지금 호감도로 어디를 만질 수 있는지.
        // 사이가 깊어질수록 열리는 곳이 늘어난다.
        function updateTouchZones() {
            const box = document.getElementById('touch-zones');
            if (!box || !ENTITY || !ENTITY.touch) return;

            const zones = ENTITY.touch.zones || [];
            const aff = (typeof myAffinity === 'number') ? myAffinity : 0;

            // 이름을 내지 않기로 한 자리는 목록에서 뺀다
            box.innerHTML = zones.filter(z => !z.hidden && z.label).map(z => {
                const open = (z.allow_from === null || z.allow_from === undefined)
                    ? true : aff >= z.allow_from;
                return open
                    ? '<b>' + z.label + '</b>'
                    : '<i>' + z.label + '</i>';
            }).join(' · ');
        }

        function refreshRelationship() {
            fetch('/api/relationship')
                .then(r => r.json())
                .then(d => {
                    if (typeof d.affinity !== 'number') return;
                    myAffinity = d.affinity;
                    myStageKey = d.stage || null;

                    myLover.yes = !!d.lover;
                    if (typeof d.ceiling === 'number') {
                        myLover.ceiling = d.ceiling;
                    }

                    // 창을 다시 열어도 배는 그대로다.
                    // 이때는 부풀어 오르는 시늉 없이 곧바로 그 모습이다 —
                    // 열 때마다 다시 배는 것처럼 보이면 안 된다.
                    if (typeof d.pregnant === 'boolean') {
                        setPregnant(d.pregnant, true);
                    }

                    if (typeof d.mood === 'number') {
                        myMood.level = d.mood;
                        myMood.label = d.mood_label || null;
                        myMood.expression = d.mood_expression || null;
                    }

                    if (typeof d.devotion === 'number') {
                        const grew = d.devotion > myDevotion.level;
                        myDevotion.level = d.devotion;
                        myDevotion.raw = d.devotion_raw || 0;
                        myDevotion.label = d.devotion_label || null;
                        if (grew) {
                            console.log('[diamondAI] 순종 ' + d.devotion
                                + ' · ' + (d.devotion_label || ''));
                        }
                    }
                    buildAffinityMarks();
                    setAffinity(d.affinity, d.label);
                    buildToolMenu();
                    updateTouchZones();
                })
                .catch(() => {});
        }
