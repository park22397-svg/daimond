        // ============================================================
        // 가위바위보
        //
        // 무엇을 낼지와 뭐라고 할지는 개체가 정한다.
        // 여기서는 사람이 낸 것을 보내고, 돌아온 대로 보여준다.
        //
        // 동작은 1.35초에 자기 것을 낸다. 결과를 그보다 먼저 말해 버리면
        // 손을 내기도 전에 답이 나와 김이 샌다. 그래서 기다렸다 말한다.
        // ============================================================

        const RPS_REVEAL_MS = 1450;

        const rpsOpen = document.getElementById('rps-open');
        const rpsHands = document.getElementById('rps-hands');

        let rpsBusy = false;

        function buildRps() {
            const hands = (ENTITY && ENTITY.game && ENTITY.game.rps
                && ENTITY.game.rps.hands) || [];

            rpsHands.innerHTML = '';

            hands.forEach(h => {
                const b = document.createElement('button');
                b.innerHTML = h.icon + '<b>' + h.label + '</b>';
                b.title = h.label;
                b.onclick = () => playRps(h.key);
                rpsHands.appendChild(b);
            });
        }

        function setRpsEnabled(on) {
            rpsHands.querySelectorAll('button')
                .forEach(b => b.disabled = !on);
        }

        async function playRps(key) {
            if (rpsBusy) return;
            rpsBusy = true;
            setRpsEnabled(false);

            if (isSleeping) wakeUp();

            // 판을 벌이는 동안에는 돌아다니지 않는다
            roam.state = 'gesture';
            faceUser();

            try {
                const res = await fetch('/api/rps', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hand: key })
                });

                const data = await res.json();
                if (!data.ok) throw new Error(data.error || '실패');

                // 먼저 손을 낸다
                if (data.motion) playMotion(data.motion);

                // 낸 뒤에 말한다
                setTimeout(() => {
                    showReply(data.reply, data.expression || 'neutral', null);

                    if (typeof data.affinity === 'number') {
                        myAffinity = data.affinity;
                        setAffinity(data.affinity, data.stage_label);
                        buildToolMenu();
                    }

                    rpsBusy = false;
                    setRpsEnabled(true);

                }, RPS_REVEAL_MS);

            } catch (e) {
                console.warn('[diamondAI] 가위바위보 실패:', e);
                rpsBusy = false;
                setRpsEnabled(true);
            }
        }

        rpsOpen.onclick = () => {
            const on = !rpsHands.classList.contains('open');
            rpsHands.classList.toggle('open', on);
            rpsOpen.classList.toggle('on', on);
        };


        // ------------------------------------------------------------
        // "가위바위보 하자" 는 모델에게 묻지 않는다
        //
        // 모델을 거치면 답이 길어지는데 립싱크가 한 글자에 0.2초라,
        // 정작 손은 한참 뒤에야 낸다. 놀이의 박자가 깨진다.
        // 그래서 이 말은 화면이 알아채고 바로 단추를 가리킨다.
        // ------------------------------------------------------------

        function rpsCfg() {
            return (ENTITY && ENTITY.game && ENTITY.game.rps) || {};
        }

        function isPolite() {
            const stages = stageList();
            const s = stages.find(x => x.key === myStageKey);
            // 아직 모르면 정중한 쪽으로 둔다. 함부로 반말하는 것보다 낫다.
            return !s || String(s.speech || '').startsWith('존댓말');
        }

        function handleRpsCommand(text) {
            const list = rpsCfg().triggers || [];
            if (!list.length) return false;

            const flat = text.replace(/\s+/g, '').toLowerCase();
            const hit = list.some(w =>
                flat.includes(String(w).replace(/\s+/g, '').toLowerCase()));

            if (!hit) return false;

            appendMessage('user', text);

            if (isSleeping) wakeUp();
            faceUser();

            // 단추를 펼치고 잠깐 눈에 띄게 한다
            rpsHands.classList.add('open');
            rpsOpen.classList.add('on', 'call');
            setTimeout(() => rpsOpen.classList.remove('call'), 3400);

            const pool = (rpsCfg().guide || {})[isPolite() ? 'polite' : 'casual']
                || [];

            if (pool.length) {
                showReply(pool[Math.floor(Math.random() * pool.length)],
                          'fun', null);
            }

            return true;
        }


        // ============================================================
        // 말풍선을 머리 옆에 붙여 두기
        //
        // 말풍선은 화면 한 자리에 고정돼 있었다. 다이아가 걸어가거나
        // 시점을 돌리면 엉뚱한 데서 말이 나온다.
        // 머리의 3차원 위치를 화면 좌표로 옮겨 매 프레임 따라가게 한다.
        // ============================================================

        const _bubbleAt = new THREE.Vector3();

        // 화면에 실제로 그린 자리. 목표를 향해 천천히 따라간다.
        //
        // 머리를 1:1 로 따라가면 숨쉬기와 끄덕임의 잔떨림까지 그대로 옮겨
        // 글자가 계속 흔들린다. 읽기 힘들다.
        // 그래서 작은 흔들림은 무시하고, 큰 움직임만 부드럽게 좇는다.
        let _bubbleX = null;
        let _bubbleY = null;

        const BUBBLE_DEADZONE = 6;      // 이보다 적게 움직이면 가만히 둔다(px)
        const BUBBLE_FOLLOW = 6;        // 클수록 빨리 따라간다

        function updateBubblePos(dt) {
            if (!currentVRM) return;

            // 말풍선 변수는 이 파일 뒤쪽에서 만들어진다.
            // 여기서 직접 찾아 쓰면 선언 순서에 기대지 않아도 된다.
            const speechBubble = document.getElementById('speech-bubble');
            if (!speechBubble || speechBubble.style.display === 'none') return;

            let head = null;
            try {
                head = currentVRM.humanoid.getBoneNode('head');
            } catch (e) {}
            if (!head) return;

            head.getWorldPosition(_bubbleAt);
            _bubbleAt.y += 0.06;                 // 눈높이보다 살짝 위

            _bubbleAt.project(camera);

            // 카메라 뒤로 돌아가면 화면에 그리지 않는다
            if (_bubbleAt.z > 1) {
                speechBubble.style.opacity = '0';
                return;
            }
            speechBubble.style.opacity = '1';

            const w = canvas.clientWidth;
            const h = canvas.clientHeight;

            let x = (_bubbleAt.x * 0.5 + 0.5) * w;
            let y = (-_bubbleAt.y * 0.5 + 0.5) * h;

            // 다이아 기준 왼쪽 = 화면에서는 오른쪽이다. 이쪽을 보고 서 있어서다.
            // 말풍선의 왼쪽 끝이 얼굴 옆에 오도록 CSS 에서
            // translate(0, -50%) 를 걸어 뒀고, 여기서는 사이를 조금 띄운다.
            const gap = 170;
            x += gap;

            // 화면 밖으로 나가지 않게 잡아 둔다
            const bw = speechBubble.offsetWidth || 200;
            const bh = speechBubble.offsetHeight || 60;
            const pad = 10;

            x = Math.max(pad, Math.min(w - bw - pad, x));
            y = Math.max(bh / 2 + pad, Math.min(h - bh / 2 - pad, y));

            // 처음이면 그 자리에 바로 놓는다
            if (_bubbleX === null) {
                _bubbleX = x;
                _bubbleY = y;
            } else {
                const dx = x - _bubbleX;
                const dy = y - _bubbleY;

                // 잔떨림은 무시한다. 이만큼 넘게 움직였을 때만 따라간다.
                if (Math.hypot(dx, dy) > BUBBLE_DEADZONE) {
                    const k = Math.min(1, (dt || 0.016) * BUBBLE_FOLLOW);
                    _bubbleX += dx * k;
                    _bubbleY += dy * k;
                }
            }

            speechBubble.style.left = Math.round(_bubbleX) + 'px';
            speechBubble.style.top = Math.round(_bubbleY) + 'px';
        }


        // ------------------------------------------------------------
        // 💤 는 다이아 귀 옆에 뜬다
        //
        // 화면 좌표로 밀어 두면 카메라가 움직이는 순간 얼굴에서
        // 떨어진다. 그래서 머리 자리에 세계 좌표로 옆·위 자리를 잡고,
        // 그 점을 화면에 투영한다.
        //
        // 옆으로 미는 방향은 다이아 기준이 아니라 **카메라 기준**이다.
        // 그래야 어느 각도에서 봐도 얼굴을 안 가리고 옆에 붙는다.
        // ------------------------------------------------------------

        const _zzzAt = new THREE.Vector3();
        const _zzzRight = new THREE.Vector3();
        const _zzzUp = new THREE.Vector3();
        const _zzzBack = new THREE.Vector3();

        const ZZZ_SIDE = 0.15;      // 귀 옆으로(m)
        const ZZZ_LIFT = 0.09;      // 귀 높이로(m)

        // 거리 1.65m 에서 3.2rem 이던 크기를 기준으로 삼는다.
        // 원근 카메라에서 보이는 크기는 거리에 반비례한다.
        const ZZZ_BASE_PX = 51.2;
        const ZZZ_BASE_DIST = 1.65;

        function updateZzzPos() {
            const el = document.getElementById('zzz-indicator');

            // 켜는 자리가 모두 'block' 을 넣는다. 아직 아무도 안 건드려
            // 빈 문자열이면 CSS 의 display:none 이라 재 봐야 0 이 나온다.
            if (!el || el.style.display !== 'block' || !currentVRM) return;

            let head = null;
            try {
                head = currentVRM.humanoid.getBoneNode('head');
            } catch (e) {}
            if (!head) return;

            head.getWorldPosition(_zzzAt);

            camera.matrixWorld.extractBasis(_zzzRight, _zzzUp, _zzzBack);
            _zzzAt.addScaledVector(_zzzRight, ZZZ_SIDE);
            _zzzAt.y += ZZZ_LIFT;

            // 크기는 얼마나 떨어져 있는지로 정한다
            const dist = camera.position.distanceTo(_zzzAt);

            _zzzAt.project(camera);

            // 카메라 뒤로 돌아가면 그리지 않는다
            if (_zzzAt.z > 1) { el.style.opacity = '0'; return; }
            el.style.opacity = '';

            const w = canvas.clientWidth;
            const h = canvas.clientHeight;

            const x = (_zzzAt.x * 0.5 + 0.5) * w;
            const y = (-_zzzAt.y * 0.5 + 0.5) * h;

            el.style.fontSize = Math.max(14, Math.min(72,
                ZZZ_BASE_PX * ZZZ_BASE_DIST / Math.max(0.3, dist))) + 'px';

            // 글자 한가운데가 그 점에 오게 한다.
            // transform 은 건드리지 않는다 — 떠오르는 시늉(sleepFloat)이
            // 그 자리를 쓰고 있어서 여기서 겹쳐 쓰면 애니메이션이 죽는다.
            el.style.left = Math.round(x - el.offsetWidth / 2) + 'px';
            el.style.top = Math.round(y - el.offsetHeight / 2) + 'px';
        }


        // ============================================================
        // 두 벌을 겹쳐 쓴다
        //
        // 옷 입은 모델(avatar.vrm)은 옷 아래 몸이 지워져 있다.
        // 몸이 7949 삼각형인데 벗은 모델(표현용.vrm)은 10022 다.
        // 그래서 옷을 당기면 그 아래가 비어 구멍이 보인다.
        //
        // 몸은 표현용에서, 옷·머리카락·기본 얼굴은 avatar 에서 가져와 겹친다.
        // 뼈대가 같으므로(휴머노이드 54개) 같은 자세를 둘 다에 그대로 준다.
        //
        // 얼굴은 두 벌 다 있다. 평소에는 기본 얼굴을 보여주고,
        // 절정 표정을 지을 때만 표현용 얼굴로 바꿔 낀다 —
        // 같은 이름의 모프인데 표현용 쪽이 더 과장돼 있기 때문이다.
        // ============================================================

        let bodyVRM = null;             // 표현용
        let baseFaces = [];             // avatar 의 얼굴 메시들
        let specialFaces = [];          // 표현용의 얼굴 메시들
        let showingSpecial = false;

        function isFaceMesh(o) {
            let p = o;
            while (p) {
                if (p.name === 'Face') return true;
                p = p.parent;
            }
            return false;
        }


        // 두 모델의 키를 맞춘다.
        //
        // 표현용은 신발을 지우면서 골격이 통째로 2.27cm 내려갔다. 비율은
        // 같은데 전체가 낮다. 그대로 겹치면 옷과 머리카락은 제자리인데
        // 몸만 가라앉아, 얼굴이 목 위로 떠 보인다.
        //
        // 숫자를 적어 두지 않는다. 파일을 다시 내보내면 또 달라지므로,
        // 두 모델의 엉덩이 본이 실제로 어디 있는지 재서 그 차이만큼 옮긴다.
        //
        // 걸어 다니면 옷 쪽이 움직이므로, 그 차이를 기억해 두고
        // 매 프레임 몸을 그만큼 떨어뜨려 따라붙인다.
        const bodyLift = new THREE.Vector3();

        function alignBody() {
            if (!currentVRM || !bodyVRM) return;

            const a = currentVRM.humanoid && currentVRM.humanoid.getBoneNode('hips');
            const b = bodyVRM.humanoid && bodyVRM.humanoid.getBoneNode('hips');
            if (!a || !b) return;

            currentVRM.scene.updateWorldMatrix(true, true);
            bodyVRM.scene.updateWorldMatrix(true, true);

            const pa = new THREE.Vector3().setFromMatrixPosition(a.matrixWorld);
            const pb = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld);

            // 지금 몸이 어디 있는지에서 출발해 차이를 더한다
            bodyLift.copy(bodyVRM.scene.position).add(pa.sub(pb))
                .sub(currentVRM.scene.position);

            followBody();

            console.log('[diamondAI] 몸 높이 보정 '
                + (bodyLift.y * 100).toFixed(2) + 'cm');
        }

        // 옷이 걸어가면 몸도 같이 간다
        function followBody() {
            if (!currentVRM || !bodyVRM) return;
            bodyVRM.scene.position.copy(currentVRM.scene.position).add(bodyLift);
        }

        function loadBody(url) {
            return new Promise(resolve => {
                new THREE.GLTFLoader().load(url, (gltf) => {
                    if (THREE.VRMUtils) {
                        THREE.VRMUtils.removeUnnecessaryJoints(gltf.scene);
                    }
                    THREE.VRM.from(gltf).then(vrm => {
                        bodyVRM = vrm;
                        vrm.scene.rotation.y = Math.PI;
                        scene.add(vrm.scene);

                        // 표현용에서 쓰는 것은 몸뿐이다.
                        // 얼굴은 절정 표정을 지을 때만 꺼내 쓰고,
                        // 신발은 avatar 쪽 것을 쓰므로 여기서는 감춘다.
                        specialFaces = [];
                        vrm.scene.traverse(o => {
                            if (!o.isMesh && !o.isSkinnedMesh) return;
                            const part = partByTriangles(o);
                            if (isFaceMesh(o)) {
                                o.visible = false;
                                specialFaces.push(o);
                            } else if (part === 'shoes') {
                                o.visible = false;
                            }
                        });

                        console.log('[diamondAI] 표현용 불러옴 · 얼굴 메시 '
                            + specialFaces.length + '개');
                        resolve(vrm);
                    });
                }, undefined, (e) => {
                    console.warn('[diamondAI] 표현용을 못 불러왔다:', e);
                    resolve(null);
                });
            });
        }

        function hideDressedBody() {
            // 몸은 표현용 것을 쓴다. 옷 입은 모델의 몸은 감춘다.
            if (!currentVRM) return;

            // 다만 대신 깔 몸이 있을 때만이다.
            // 표현용을 안 불러온 채로 감추면 옷만 떠 있게 된다.
            const swap = !!bodyVRM;

            baseFaces = [];
            currentVRM.scene.traverse(o => {
                if (!o.isMesh && !o.isSkinnedMesh) return;
                if (o.userData && o.userData.bone) return;
                if (isFaceMesh(o)) { baseFaces.push(o); return; }
                if (swap && partByTriangles(o) === 'body') o.visible = false;
            });
            console.log('[diamondAI] 기본 얼굴 메시 ' + baseFaces.length + '개');
        }

        function useSpecialFace(on) {
            if (!specialFaces.length) return;
            if (showingSpecial === on) return;
            showingSpecial = on;
            baseFaces.forEach(m => m.visible = !on);
            specialFaces.forEach(m => m.visible = on);
        }


        // ============================================================
        // 몸과 옷 나누기
        //
        // VRM 안에서 옷은 이미 따로 그려진다. Body 메시가 프리미티브
        // 6개(몸·윗옷·신발·뒷머리·원피스)로 나뉘어 있고,
        // three.js 는 프리미티브 하나를 Mesh 하나로 만들기 때문이다.
        //
        // 그러니 새로 자를 것은 없고, 어느 것이 무엇인지 이름표만 붙이면 된다.
        // 재질 이름이 그 표식이다.
        // ============================================================

        const PARTS = { body: [], top: [], skirt: [], shoes: [], socks: [], hair: [] };

        function meshTriangles(mesh) {
            if (!mesh.geometry) return -1;
            const idx = mesh.geometry.index;
            return idx ? idx.count / 3
                       : mesh.geometry.attributes.position.count / 3;
        }

        function meshLabel(mesh) {
            const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
            return (mats[0] && mats[0].name) || mesh.name || '';
        }

        // 재질 이름을 먼저 본다.
        //
        // 예전에는 삼각형 수만 봤다. 그러다 표현용.vrm 을 다시 내보내면서
        // 몸이 10022 에서 10934 삼각형이 되자 표에서 사라졌고, 화면에서
        // 몸이 통째로 없어졌다. 재질 이름은 다시 내보내도 그대로다.
        // 삼각형 수는 이름을 잃었을 때의 대비로만 남긴다.
        function partByTriangles(mesh) {
            const table = (ENTITY && ENTITY.model_parts) || [];
            if (!table.length) return null;

            const label = meshLabel(mesh).toLowerCase();
            for (const r of table) {
                if (r.match && label.includes(r.match)) return r.zone;
            }

            const tris = meshTriangles(mesh);
            const hit = table.find(p => p.triangles === tris);
            return hit ? hit.zone : null;
        }

        // 이름으로도 한 번 더 본다. 표에 없는 메시를 위한 대비다.
        function partOf(materialName) {
            const n = String(materialName || '').toUpperCase();
            if (n.includes('HAIR')) return 'hair';
            if (n.includes('ONEPIECE')) return 'skirt';
            if (n.includes('TOPS')) return 'top';
            if (n.includes('SHOES')) return 'shoes';
            return 'body';          // SKIN, FACE, EYE ...
        }


        // ============================================================
        // 한 덩어리인 옷 자르기
        //
        // 신발과 양말은 한 벌로 붙어 있다. 다리 하나가 삼각형 409개짜리
        // 조각 하나로 발바닥에서 정강이까지 이어져 있어, 조각을 세어
        // 나눌 수 없다. 그래서 개체가 정해 준 높이에서 삼각형을 갈라
        // 위쪽만 새 메시로 떼어낸다.
        //
        // 정점은 그대로 두고 색인만 나눈다. 같은 뼈대에 다시 묶으므로
        // 움직임도 그대로다.
        // ============================================================

        function cutAbove(mesh, cutY) {
            const geo = mesh.geometry;
            if (!geo || !geo.index) return null;

            const pos = geo.attributes.position;
            const idx = geo.index.array;
            const low = [], high = [];

            for (let i = 0; i < idx.length; i += 3) {
                const y = (pos.getY(idx[i]) + pos.getY(idx[i + 1])
                         + pos.getY(idx[i + 2])) / 3;
                const bin = (y >= cutY) ? high : low;
                bin.push(idx[i], idx[i + 1], idx[i + 2]);
            }

            if (!high.length || !low.length) return null;

            const upGeo = geo.clone();
            upGeo.setIndex(high);
            upGeo.computeBoundingSphere();
            upGeo.computeBoundingBox();

            const up = new THREE.SkinnedMesh(upGeo, mesh.material);
            up.name = mesh.name + '_잘린위';
            if (mesh.skeleton) up.bind(mesh.skeleton, mesh.bindMatrix);
            up.bindMode = mesh.bindMode;
            up.frustumCulled = mesh.frustumCulled;
            mesh.parent.add(up);

            geo.setIndex(low);
            geo.computeBoundingSphere();
            geo.computeBoundingBox();

            return up;
        }

        function applySplits(parts) {
            const rules = (ENTITY && ENTITY.model_splits) || [];

            rules.forEach(r => {
                const src = parts[r.from];
                if (!src || !src.length) return;

                parts[r.zone] = parts[r.zone] || [];

                src.slice().forEach(m => {
                    const up = cutAbove(m, r.above);
                    if (!up) return;
                    up.userData.part = r.zone;
                    parts[r.zone].push(up);
                });

                console.log('[diamondAI] ' + r.from + ' 에서 ' + r.label
                    + ' ' + parts[r.zone].length + '개를 갈라냈다 ('
                    + (r.above * 100).toFixed(0) + 'cm 위)');
            });
        }

        function splitParts() {
            Object.keys(PARTS).forEach(k => PARTS[k] = []);
            cloths.length = 0;      // 다시 나눌 때 겹쳐 쌓이지 않게

            if (!currentVRM) return;

            currentVRM.scene.traverse(o => {
                if (!o.isMesh && !o.isSkinnedMesh) return;
                if (o.userData && o.userData.bone) return;   // 판정구는 뺀다

                const mats = Array.isArray(o.material) ? o.material : [o.material];
                const label = (mats[0] && mats[0].name) || o.name || '';

                // 삼각형 수가 먼저다. 이름은 표에 없을 때만 쓴다.
                const part = partByTriangles(o) || partOf(label);

                const idx = o.geometry && o.geometry.index;
                console.log('[diamondAI] 메시 "' + label + '" 삼각형 '
                    + (idx ? idx.count / 3 : '?') + ' -> ' + part);

                o.userData.part = part;

                if (o.isSkinnedMesh) detachCloth(o);

                PARTS[part].push(o);
            });

            // 신발에서 양말을 갈라낸다. 따로 벗을 수 있어야 한다.
            applySplits(PARTS);

            const summary = Object.keys(PARTS)
                .map(k => k + ' ' + PARTS[k].length).join(', ');

            console.log('[diamondAI] 몸/옷 나눔: ' + summary);

            if (!PARTS.skirt.length && !PARTS.top.length) {
                console.warn('[diamondAI] 옷 메시를 못 찾았다. 재질 이름을 확인하라:');
                currentVRM.scene.traverse(o => {
                    if (!o.isMesh && !o.isSkinnedMesh) return;
                    if (o.userData && o.userData.bone) return;
                    const m = Array.isArray(o.material) ? o.material[0] : o.material;
                    console.warn('   물체 "' + o.name + '"  재질 "'
                        + (m && m.name) + '"');
                });
            }
        }


        // ------------------------------------------------------------
        // 옷 잡아당기기
        //
        // 옷 메시만 살짝 옮겼다가 되돌린다. 스키닝 메시라도 물체 자체를
        // 옮기면 그대로 딸려 오므로, 뼈를 건드리지 않고 옷만 끌 수 있다.
        // ------------------------------------------------------------

        const tug = { list: [], offset: new THREE.Vector3(), amount: 0 };

        // 화면에서 끈 방향을 월드 방향으로 옮긴다.
        //
        // 화면의 가로·세로는 카메라의 오른쪽·위쪽이다. 그 둘을 섞으면
        // 보는 각도가 어떻든 '마우스로 끈 쪽'이 나온다.
        // 화면 y 는 아래가 커지므로 위쪽 축에는 부호를 뒤집어 곱한다.
        const _camRight = new THREE.Vector3();
        const _camUp = new THREE.Vector3();
        const _camBack = new THREE.Vector3();

        function screenPullToWorld(px, py, out) {
            camera.matrixWorld.extractBasis(_camRight, _camUp, _camBack);

            out.set(0, 0, 0)
                .addScaledVector(_camRight, px)
                .addScaledVector(_camUp, -py);

            if (out.lengthSq() < 1e-9) {
                // 방향이 없으면(단추로 부른 경우) 아래로 늘어뜨린다
                out.copy(_camUp).multiplyScalar(-1);
            }

            return out.normalize();
        }

        function tugCloth(zone, distance, pull) {
            const meshes = PARTS[zone];

            if (!meshes || !meshes.length) {
                console.warn('[diamondAI] 끌 옷이 없다: ' + zone);
                return;
            }

            tug.list = meshes;
            tug.amount = 1;

            // 마우스로 끈 방향으로 끌린다.
            // 어디서도 방향이 오지 않으면 아래로 늘어뜨린다.
            const dir = new THREE.Vector3();
            screenPullToWorld(
                (pull && pull.x) || 0,
                (pull && pull.y) || 0,
                dir
            );

            // 몸에서 살짝 떼어 놓아야 끌린 것이 보인다. 보는 쪽으로 띄운다.
            camera.matrixWorld.extractBasis(_camRight, _camUp, _camBack);

            tug.offset
                .copy(dir).multiplyScalar(distance)
                .addScaledVector(_camBack, distance * 0.3);

            console.log('[diamondAI] 옷 끌림: ' + zone
                + ' ' + (distance * 100).toFixed(1) + 'cm, 방향 ('
                + tug.offset.x.toFixed(3) + ', '
                + tug.offset.y.toFixed(3) + ', '
                + tug.offset.z.toFixed(3) + '), 메시 '
                + meshes.length + '개');
        }


        // ------------------------------------------------------------
        // 옷을 실제로 옮기는 자리
        //
        // 스키닝 메시는 position 을 건드려도 꿈쩍도 안 한다. 셰이더가
        //   matrixWorld * bindMatrixInverse * (본이 만든 월드 좌표)
        // 를 그리는데, bindMode 가 'attached' 면 three.js 가 매 프레임
        // bindMatrixInverse = matrixWorld 의 역행렬로 다시 잡아서
        // 앞의 matrixWorld 와 그대로 상쇄되기 때문이다.
        //
        // 'detached' 로 바꾸면 상쇄가 풀리지만, 이번에는 three.js 가
        // 매 프레임 bindMatrixInverse = bindMatrix 의 역행렬로 되돌린다
        // (r137 SkinnedMesh.updateMatrixWorld). 그래서 이 값을 손으로
        // 고쳐 놓아도 첫 프레임에 지워진다. 옷과 머리카락만 앞뒤가
        // 뒤집혔던 것이 이것 때문이다 — 아바타를 돌려 세운 180도가
        // 상쇄되지 않고 한 번 더 곱해졌다.
        //
        // 그래서 bindMatrixInverse 대신 matrixWorld 쪽을 잡는다.
        //   matrixWorld = T(옮길 거리) * bindMatrix
        // 로 두면 셰이더에서 bindMatrix 가 제 역행렬과 만나 지워지고
        // T 만 남는다. 안 옮겼으면 T 가 단위행렬이라 원래 자리 그대로다.
        //
        // matrixWorld 는 three.js 가 parent.matrixWorld * matrix 로
        // 만드니 우리가 쥘 것은 matrix 다. matrixAutoUpdate 를 끈다.
        //
        // 옮기는 거리는 월드 기준이다. 마우스로 끈 방향을 그대로 쓸 수 있다.
        // ------------------------------------------------------------

        const cloths = [];
        const _tugMat = new THREE.Matrix4();
        const _parentInv = new THREE.Matrix4();

        function detachCloth(m) {
            m.bindMode = 'detached';
            m.matrixAutoUpdate = false;
            m.userData.tug = new THREE.Vector3();
            cloths.push(m);
            placeCloth(m);
        }

        function placeCloth(m) {
            if (!m.parent) return;

            // 아바타가 걸어 다니면 부모의 matrixWorld 가 바뀐다.
            // 그때마다 다시 잡지 않으면 옷만 딴 데로 간다.
            m.parent.updateWorldMatrix(true, false);

            const d = m.userData.tug;
            _tugMat.makeTranslation(d.x, d.y, d.z).multiply(m.bindMatrix);
            _parentInv.copy(m.parent.matrixWorld).invert();

            m.matrix.multiplyMatrices(_parentInv, _tugMat);
            m.matrixWorldNeedsUpdate = true;
        }

        function placeAllCloths() {
            for (let i = 0; i < cloths.length; i++) placeCloth(cloths[i]);
        }

        function updateTug(dt) {
            if (!tug.list.length) return;

            // 되돌아가는 속도. 확 당겼다가 천천히 놓는 느낌으로.
            tug.amount -= dt * 1.8;
            if (tug.amount < 0) tug.amount = 0;

            const e = tug.amount * tug.amount;      // 끝에서 부드럽게

            tug.list.forEach(m => {
                if (!m.userData.tug) return;
                m.userData.tug.set(
                    tug.offset.x * e,
                    tug.offset.y * e,
                    tug.offset.z * e
                );
            });

            if (tug.amount === 0) {
                tug.list.forEach(m => {
                    if (m.userData.tug) m.userData.tug.set(0, 0, 0);
                });
                tug.list = [];
            }
        }


        // ============================================================
        // 만지기
        //
        // 메시를 직접 레이캐스트하지 않는다. 15MB 짜리라 비싸고,
        // 스키닝을 라이브러리가 반영해 주는지에 따라 결과가 달라진다.
        // 대신 개체가 내려준 '판정구'를 본에 붙여 그것만 맞힌다.
        // 본에 붙어 있으니 자세가 바뀌어도 그대로 따라가고,
        // 맞은 공이 곧 어느 본인지 알려준다.
        // ============================================================

        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();

        let hitboxes = [];
        let showHitboxes = false;

        const HITBOX_HIDDEN = new THREE.MeshBasicMaterial({
            colorWrite: false, depthWrite: false, transparent: true, opacity: 0
        });

        const HITBOX_SHOWN = new THREE.MeshBasicMaterial({
            color: 0x7a68b0, wireframe: true, transparent: true, opacity: 0.55
        });

        function buildHitboxes() {
            hitboxes.forEach(h => h.parent && h.parent.remove(h));
            hitboxes = [];

            if (!currentVRM || !ENTITY || !ENTITY.touch) return;

            const geo = new THREE.SphereGeometry(1, 10, 8);

            (ENTITY.touch.hitboxes || []).forEach(h => {
                let node = null;
                try {
                    node = currentVRM.humanoid.getBoneNode(h.bone);
                } catch (e) {}
                if (!node) return;

                const m = new THREE.Mesh(geo, HITBOX_HIDDEN);
                m.position.set(h.offset[0], h.offset[1], h.offset[2]);
                m.scale.setScalar(h.radius);
                m.userData.bone = h.bone;
                // 옷 판정구는 자기가 어느 자리인지 직접 들고 있다
                m.userData.zone = h.zone || null;
                m.raycast = THREE.Mesh.prototype.raycast;
                node.add(m);
                hitboxes.push(m);
            });

            console.log('[diamondAI] 판정구 ' + hitboxes.length + '개');
        }

        function toggleHitboxes() {
            showHitboxes = !showHitboxes;
            hitboxes.forEach(h => h.material =
                showHitboxes ? HITBOX_SHOWN : HITBOX_HIDDEN);

            // 상대의 몸도 같이 드러낸다. 평소에는 투명이라
            // 어디에 서 있는지 눈으로 볼 방법이 이것뿐이다.
            userBody.material = showHitboxes ? USER_SHOWN : USER_HIDDEN;
        }

        function pickBone(event) {
            if (!hitboxes.length) return null;

            const rect = canvas.getBoundingClientRect();
            pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointerNDC, camera);

            const hits = raycaster.intersectObjects(hitboxes, false);
            if (!hits.length) return null;

            const hit = hits[0];

            // 손이 닿는 거리 밖이면 못 만진다.
            // 방 건너편에서 쓰다듬을 수는 없다 — 만지려면 다가가야 한다.
            if (user.on && hit.distance > followCfg('reach', 0.95)) return null;

            const node = hit.object.parent;
            const local = node.worldToLocal(hit.point.clone());

            return {
                bone: hit.object.userData.bone,
                zone: hit.object.userData.zone,
                local: [local.x, local.y, local.z]
            };
        }


        // ------------------------------------------------------------
        // 누르기와 쓰다듬기
        //
        // 누르고 조금이라도 끌면 쓰다듬기로 본다.
        // 끈 거리가 쌓일 때마다 한 번씩 반응하되, 너무 자주 말하지 않도록
        // 개체가 정한 간격을 지킨다.
        // ------------------------------------------------------------

        // ------------------------------------------------------------
        // 무엇으로 만질지 고르기
        //
        // 같은 자리를 만져도 손으로 만지는 것과 입을 맞추는 것은 다르다.
        // 도구 목록과 그 반응은 개체가 가지고 있고, 여기서는 고르기만 한다.
        // ------------------------------------------------------------

        const toolBadge = document.getElementById('tool-badge');
        const toolMenu = document.getElementById('tool-menu');

        let currentTool = null;
        let myAffinity = null;      // 잠긴 도구를 표시하는 데만 쓴다
        let myStageKey = null;      // 존댓말인지 반말인지 고르는 데 쓴다

        function tools() {
            return (ENTITY && ENTITY.touch && ENTITY.touch.tools) || [];
        }

        function toolLocked(t) {
            if (!t.allow_bonus) return false;
            if (myAffinity === null) return false;
            // 어느 자리든 이 도구로 만질 수 있는 곳이 하나라도 있는지
            const zones = (ENTITY.touch.zones || []);
            return !zones.some(z =>
                myAffinity >= ((z.allow_from || 0) + t.allow_bonus));
        }

        function setTool(key) {
            const list = tools();
            currentTool = list.find(t => t.key === key) || list[0] || null;
            if (currentTool) {
                toolBadge.textContent = currentTool.icon + ' ' + currentTool.label;
            }
            buildToolMenu();
        }

        function buildToolMenu() {
            const list = tools();
            if (!list.length) return;

            toolMenu.innerHTML = '';

            const head = document.createElement('div');
            head.className = 'head';
            head.textContent = '무엇으로 만질까';
            toolMenu.appendChild(head);

            list.forEach(t => {
                const locked = toolLocked(t);

                const row = document.createElement('div');
                row.className = 'item'
                    + (currentTool && t.key === currentTool.key ? ' on' : '')
                    + (locked ? ' locked' : '');

                const icon = document.createElement('span');
                icon.className = 'icon';
                icon.textContent = t.icon;
                row.appendChild(icon);

                const text = document.createElement('span');
                text.innerHTML = t.label +
                    (t.description ? '<span class="desc">' + t.description + '</span>' : '');
                row.appendChild(text);

                if (locked) {
                    const lock = document.createElement('span');
                    lock.className = 'lock';
                    lock.textContent = '아직';
                    row.appendChild(lock);
                }

                // 잠겨 있어도 고를 수는 있다. 만지면 거절당할 뿐이다.
                row.onclick = () => {
                    setTool(t.key);
                    hideToolMenu();
                };

                toolMenu.appendChild(row);
            });
        }

        function showToolMenu(x, y) {
            buildToolMenu();
            toolMenu.style.display = 'block';

            const box = toolMenu.getBoundingClientRect();
            const area = document.getElementById('avatar-container')
                .getBoundingClientRect();

            let left = x - area.left;
            let top = y - area.top;

            if (left + box.width > area.width) left = area.width - box.width - 8;
            if (top + box.height > area.height) top = area.height - box.height - 8;

            toolMenu.style.left = Math.max(6, left) + 'px';
            toolMenu.style.top = Math.max(6, top) + 'px';
        }

        function hideToolMenu() {
            toolMenu.style.display = 'none';
        }


        // ------------------------------------------------------------
        // 옷 벗기기
        //
        // 옷을 두 번 누르면 벗는다. 두 번 더 누르면 다시 입는다.
        // 그 옷을 만져도 되는 사이여야 한다 — 서버가 판단한다.
        //
        // 벗기면 그 자리에 몸이 드러난다. 표현용 몸을 깔아 두었기에
        // 가능한 일이다(model.layered). 안 깔았으면 구멍이 보인다.
        // ------------------------------------------------------------

        const wearing = {};      // 자리 -> 입고 있는가

        // 지금 벗겨 둔 자리들. 서버가 판정에 쓴다.
        function undressedZones() {
            return Object.keys(wearing).filter(k => wearing[k] === false);
        }

        async function undress(zoneKey) {
            const meshes = PARTS[zoneKey];
            if (!meshes || !meshes.length) return;

            const on = wearing[zoneKey] !== false;   // 기본은 입고 있음

            try {
                const d = await fetch('/api/undress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone: zoneKey, wearing: on }),
                }).then(r => r.json());

                if (!d.ok) {
                    if (d.reply) showReply(d.reply, d.expression || 'angry', null);
                    return;
                }

                // 벗기거나 입힌다
                meshes.forEach(m => m.visible = !on);
                wearing[zoneKey] = !on;

                if (d.reply) showReply(d.reply, d.expression || 'surprised', null);

                console.log('[diamondAI] ' + zoneKey
                    + (on ? ' 벗음' : ' 입음'));

            } catch (e) {
                console.warn('[diamondAI] 옷 벗기기 실패', e);
            }
        }

        canvas.addEventListener('dblclick', (e) => {
            const hit = pickBone(e);
            if (!hit || !hit.zone) return;

            const list = (ENTITY && ENTITY.touch && ENTITY.touch.undress
                && ENTITY.touch.undress.zones) || ['top', 'skirt', 'shoes'];

            if (list.indexOf(hit.zone) < 0) return;

            // 쥐고 있던 '한 번 누름' 을 없던 일로 한다.
            // 이게 없으면 벗기면서 만진 대답까지 같이 나온다.
            cancelHeldTap();

            e.preventDefault();
            undress(hit.zone);
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showToolMenu(e.clientX, e.clientY);
        });

        toolBadge.addEventListener('click', (e) => {
            e.preventDefault();
            showToolMenu(e.clientX, e.clientY);
        });

        toolBadge.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showToolMenu(e.clientX, e.clientY);
        });

        document.addEventListener('pointerdown', (e) => {
            if (!toolMenu.contains(e.target) && e.target !== toolBadge) {
                hideToolMenu();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideToolMenu();
        });


        const touchState = {
            down: false,
            petting: false,
            dragged: 0,
            sinceStroke: 0,
            strokes: 0,
            lastX: 0,
            lastY: 0,
            hit: null,
            lastFire: 0,
            busy: false
        };

        function touchCfg(key, fallback) {
            const t = (ENTITY && ENTITY.touch) || {};
            const v = t[key];
            return (typeof v === 'number') ? v : fallback;
        }

        // 입맞춤인지 아닌지는 서버가 정한다.
        // 여기서는 '눈을 감고 기다리는 중이었다' 만 알려준다 —
        // 어느 자리를 만졌는지 아는 쪽은 화면이 아니라 서버다.
        async function sendTouch(kind, hit, count) {
            const now = Date.now();
            if (touchState.busy) return;
            if (now - touchState.lastFire < touchCfg('cooldown_ms', 700)) return;

            touchState.lastFire = now;
            touchState.busy = true;

            try {
                const res = await fetch('/api/touch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bone: hit.bone,
                        zone: hit.zone,
                        local: hit.local,
                        kind: kind,
                        count: count,
                        tool: currentTool ? currentTool.key : null,

                        // 눈을 감고 기다리는 중이었는가.
                        // 서버가 자리와 도구를 보고 입맞춤인지 마무리한다.
                        kiss_ready: kissWaiting,

                        // 무엇을 벗겨 두었는가. 옷을 입은 채로는
                        // 닿지 않는 자리가 있다.
                        undressed: undressedZones()
                    })
                });

                if (!res.ok) throw new Error('HTTP ' + res.status);

                const data = await res.json();
                if (data.hit) playTouchReaction(data);

            } catch (e) {
                console.warn('[diamondAI] 만지기 반응 실패:', e);
            } finally {
                touchState.busy = false;
            }
        }

        function playTouchReaction(data) {
            if (isSleeping) wakeUp();

            // 입을 맞췄으면 기다리기는 여기서 끝난다.
            // 그대로 두면 이 반응의 얼굴을 눈감기가 도로 덮는다.
            if (data.kind === 'kiss') kissWaiting = false;

            // 아이가 섰으면 배가 불러 온다
            if (typeof data.pregnant === 'boolean') {
                setPregnant(data.pregnant, false);
            }

            if (data.pregnant_now) {
                showHint('아이가 섰다', 5200);
            }

            // 만졌으면 그쪽을 본다
            faceUser();

            // 기분이 움직였으면 눈금 이름표에 반영한다
            if (typeof data.mood === 'number') {
                myMood.level = data.mood;
                myMood.label = data.mood_label || null;
            }

            // 사이가 달라지면 눈금도 잠긴 도구도 달라진다
            if (typeof data.affinity === 'number') {
                myAffinity = data.affinity;
                myStageKey = data.stage || myStageKey;
                setAffinity(data.affinity, data.stage_label);
                buildToolMenu();
            }

            if (data.silent) {
                // 입을 닫았다. 만져도 말하지 않는다.
                showSilence(data.expression || 'angry');
                return;
            }

            // 여러 번 잡아당겼으면 옷이 실제로 끌려온다
            if (data.tug) {
                tugCloth(data.tug.zone, data.tug.distance, {
                    x: touchState.pullX || 0,
                    y: touchState.pullY || 0,
                });
            }

            if (data.reply) {
                showReply(data.reply, data.expression || 'neutral', null);
            } else {
                applyExpression(data.expression || 'neutral');
            }

            // 표정이 둘 이어지는 자리가 있다.
            //
            // 손을 잡히면 먼저 놀라고, 곧 좋아하는 얼굴이 된다.
            // 한 얼굴로는 그 흐름이 안 나온다. 놀람은 스치듯 짧게.
            if (data.expression_then) {
                const first = expressionByKey(data.expression || '');
                const ms = (first && first.hold_ms) ? first.hold_ms : 900;

                setTimeout(() => {
                    applyExpression(data.expression_then);
                }, Math.min(ms, 1000));
            }

            // 몸짓은 돌아다니기보다 우선한다
            if (data.motion) {
                roam.state = 'gesture';
                playMotion(data.motion);
            }
        }

        // 빈 곳을 끄는 중인가. 1인칭에서는 이게 고개 돌리기다.
        const look = { on: false, x: 0, y: 0 };

        canvas.addEventListener('pointerdown', (e) => {
            const hit = pickBone(e);

            // 아바타를 눌렀으면 만지는 것이고, 빈 곳이면 시점을 돌리는 것이다.
            // 둘 다 왼쪽 끌기라 여기서 갈라 줘야 서로 방해하지 않는다.
            // 1인칭에서는 궤도 시점을 아예 안 쓴다 — 대신 고개를 돌린다.
            controls.enabled = !hit && !user.on;

            if (!hit) {
                if (user.on) {
                    look.on = true;
                    look.x = e.clientX;
                    look.y = e.clientY;
                    canvas.setPointerCapture(e.pointerId);
                }
                return;
            }

            e.preventDefault();
            canvas.setPointerCapture(e.pointerId);

            touchState.down = true;
            touchState.petting = false;
            touchState.dragged = 0;
            touchState.sinceStroke = 0;
            touchState.strokes = 0;
            touchState.lastX = e.clientX;
            touchState.lastY = e.clientY;
            // 옷이 끌려갈 방향을 알려면 어디서 시작했는지가 있어야 한다
            touchState.fromX = e.clientX;
            touchState.fromY = e.clientY;
            touchState.pullX = 0;
            touchState.pullY = 0;
            touchState.hit = hit;
        });

        canvas.addEventListener('pointermove', (e) => {

            // 빈 곳을 끌면 고개가 돈다. 마우스를 오른쪽으로 밀면
            // 시선도 오른쪽으로 가야 하므로 yaw 는 빼는 쪽이다.
            if (look.on) {
                user.yaw -= (e.clientX - look.x) * LOOK_SENS;
                user.pitch = Math.max(-1.05, Math.min(1.05,
                    user.pitch - (e.clientY - look.y) * LOOK_SENS));
                look.x = e.clientX;
                look.y = e.clientY;
                return;
            }

            if (!touchState.down) {
                // 누르지 않았을 때는 만질 수 있는 곳인지 알려만 준다
                canvas.style.cursor = pickBone(e) ? 'grab' : 'default';
                return;
            }

            const dx = e.clientX - touchState.lastX;
            const dy = e.clientY - touchState.lastY;
            const step = Math.hypot(dx, dy);

            touchState.lastX = e.clientX;
            touchState.lastY = e.clientY;
            touchState.dragged += step;
            touchState.sinceStroke += step;

            // 잡은 자리에서 지금까지 끌어온 방향. 옷은 이쪽으로 끌린다.
            touchState.pullX = e.clientX - touchState.fromX;
            touchState.pullY = e.clientY - touchState.fromY;

            // 끄는 동안 다른 자리로 넘어가면 그 자리로 바꾼다
            const here = pickBone(e);
            if (here) touchState.hit = here;

            if (touchState.dragged >= touchCfg('pet_drag_px', 26)) {
                touchState.petting = true;
                canvas.style.cursor = 'grabbing';
            }

            if (touchState.petting &&
                touchState.sinceStroke >= touchCfg('pet_stroke_px', 90)) {

                touchState.sinceStroke = 0;
                touchState.strokes += 1;

                if (touchState.hit) {
                    sendTouch('pet', touchState.hit, touchState.strokes);
                }
            }
        });

        // 옷은 두 번 눌러야 벗는다. 그런데 한 번 누른 것도 만진 것이라
        // 대답이 나가서, 벗기려다 두 번 다 대답을 듣게 된다.
        //
        // 그래서 옷자리를 한 번 누른 것은 곧바로 보내지 않고 잠깐 쥐고
        // 있는다. 그 사이에 두 번째 누름(dblclick)이 오면 없던 일이 된다.
        // 창이 두 번 누름으로 치는 간격보다 넉넉해야 한다.
        const UNDRESS_HOLD_MS = 400;

        let tapHoldTimer = null;

        function isUndressZone(zoneKey) {
            if (!zoneKey) return false;
            const u = (ENTITY && ENTITY.touch && ENTITY.touch.undress) || {};
            if (u.enabled === false) return false;
            return (u.zones || ['top', 'skirt', 'shoes']).indexOf(zoneKey) >= 0;
        }

        function cancelHeldTap() {
            if (tapHoldTimer) {
                clearTimeout(tapHoldTimer);
                tapHoldTimer = null;
            }
        }

        function endTouch(e) {
            look.on = false;

            // 다음 번에 빈 곳을 끌면 시점이 돌아야 한다.
            // 1인칭에서는 궤도 시점을 계속 꺼 둔다.
            controls.enabled = !user.on;

            if (!touchState.down) return;

            touchState.down = false;
            canvas.style.cursor = pickBone(e) ? 'grab' : 'default';

            // 끌지 않았으면 그냥 한 번 누른 것이다
            if (!touchState.petting && touchState.hit) {
                const hit = touchState.hit;

                // 옷이면 두 번째 누름이 오는지 잠깐 기다렸다 보낸다
                cancelHeldTap();

                if (isUndressZone(hit.zone)) {
                    tapHoldTimer = setTimeout(() => {
                        tapHoldTimer = null;
                        sendTouch('tap', hit, 1);
                    }, UNDRESS_HOLD_MS);
                } else {
                    sendTouch('tap', hit, 1);
                }
            }

            // 쓰다듬다 말았는데 아직 한 번도 반응하지 않았다면 한 번은 해준다
            if (touchState.petting && touchState.strokes === 0 && touchState.hit) {
                sendTouch('pet', touchState.hit, 1);
            }

            touchState.petting = false;
        }

        canvas.addEventListener('pointerup', endTouch);
        canvas.addEventListener('pointercancel', endTouch);
        canvas.addEventListener('pointerleave', (e) => {
            if (!touchState.down) canvas.style.cursor = 'default';
        });

        // ------------------------------------------------------------
        // 상대를 움직이는 키
        //
        // keydown 은 누른 순간 한 번이지만 걷기는 누르고 있는 내내여야
        // 한다. 그래서 눌린 키를 `held` 에 적어 두고 그리기 고리가 읽는다.
        // ------------------------------------------------------------

        window.addEventListener('keydown', (e) => {
            if (document.activeElement === chatInput) return;
            if (!e.key) return;

            if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
                e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                held[e.key] = true;
                e.preventDefault();      // 창이 같이 스크롤되면 안 된다
                return;
            }

            if (e.key === 'Shift') {
                held.Shift = true;       // 누르는 동안 앉는다
                return;
            }

            if (e.key === ' ') {
                e.preventDefault();
                // 발이 땅에 닿아 있을 때만 뛴다. 공중에서 또 누르면 안 된다.
                if (user.on && user.lift === 0 && user.vy === 0) {
                    user.vy = USER_JUMP;
                }
                return;
            }

            if (e.key === 'f' || e.key === 'F') {
                setFirstPerson(!user.on);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (!e.key) return;
            if (e.key === 'Shift') { held.Shift = false; return; }
            if (e.key.indexOf('Arrow') === 0) held[e.key] = false;
        });

        // 창에서 눈을 떼면 누르고 있던 키가 눌린 채로 남아 혼자 걸어간다
        window.addEventListener('blur', () => {
            for (const k in held) held[k] = false;
        });


        // 판정구를 눈으로 확인하고 싶을 때
        window.addEventListener('keydown', (e) => {
            if (document.activeElement === chatInput) return;

            if (e.key === 'h' || e.key === 'H') {
                toggleHitboxes();
            }

            // 시점을 원래대로
            if (e.key === 'r' || e.key === 'R') {
                resetCamera();
            }

            // 옷 끌림을 손으로 시험한다. 끄는 횟수를 채우지 않고도 볼 수 있다.
            if (e.key === 't' || e.key === 'T') {
                tugCloth('skirt', 0.08);
            }
            if (e.key === 'y' || e.key === 'Y') {
                tugCloth('top', 0.08);
            }
        });


        // ============================================================
        // 눈 상태
        // ============================================================

        function setEyeState(close) {

            if (
                !currentVRM ||
                !currentVRM.blendShapeProxy
            ) {
                return;
            }

            try {

                const presetName =
                    (
                        THREE.VRMBlendShapePresetName &&
                        THREE.VRMBlendShapePresetName.Blink
                    )
                        ? THREE.VRMBlendShapePresetName.Blink
                        : 'blink';

                currentVRM.blendShapeProxy.setValue(
                    presetName,
                    close ? 1.0 : 0.0
                );

                currentVRM.blendShapeProxy.update();

            } catch (e) {

                console.warn(
                    "눈 상태 변경 실패:",
                    e
                );

            }
        }


        // ============================================================
        // 표정 적용
        // ============================================================

        // ============================================================
        // 새 아바타의 커스텀 놀람 표정 자동 탐색
        // ============================================================

        let surprisedBlendShapeName = null;

        function detectSurprisedBlendShape(gltf) {
            surprisedBlendShapeName = null;

            try {
                // 최상위 확장은 gltf.userData 에 들어가지 않는다.
                // GLTFLoader 는 그걸 parser.json 에만 남긴다.
                // 여기를 userData 로만 보고 있어서 목록이 늘 비었고,
                // 그래서 놀람 표정이 한 번도 걸리지 않았다.
                const ext = (gltf && gltf.parser && gltf.parser.json
                             && gltf.parser.json.extensions
                             && gltf.parser.json.extensions.VRM)
                    || (gltf && gltf.userData
                        && gltf.userData.gltfExtensions
                        && gltf.userData.gltfExtensions.VRM);

                const groups = ext && ext.blendShapeMaster
                    && ext.blendShapeMaster.blendShapeGroups;
                const names = Array.isArray(groups)
                    ? groups.map(g => g?.name).filter(Boolean)
                    : [];

                console.log('[diamondAI] VRM 표정 목록:', names);

                const normalize = value => String(value)
                    .trim().toLowerCase().replace(/[ _-]/g, '');

                const exactCandidates = [
                    'surprised', 'surprise', 'shocked', 'shock',
                    '놀람', '놀람표정', '驚き'
                ];

                for (const candidate of exactCandidates) {
                    const found = names.find(name =>
                        normalize(name) === normalize(candidate)
                    );
                    if (found) {
                        surprisedBlendShapeName = found;
                        break;
                    }
                }

                if (!surprisedBlendShapeName) {
                    const found = names.find(name => {
                        const n = normalize(name);
                        return n.includes('surpris') ||
                               n.includes('shock') ||
                               n.includes('놀람') ||
                               n.includes('驚');
                    });
                    if (found) surprisedBlendShapeName = found;
                }

                if (surprisedBlendShapeName) {
                    console.log(
                        '[diamondAI] 놀람 표정 발견:',
                        surprisedBlendShapeName
                    );
                } else {
                    console.warn(
                        '[diamondAI] 커스텀 놀람 표정을 찾지 못했어. VRM 표정 목록을 확인해줘.'
                    );
                }
            } catch (error) {
                console.warn('[diamondAI] 놀람 표정 탐색 실패:', error);
            }
        }


        // ============================================================
        // 표정 적용
        // ============================================================

        // 말하는 동안 입 대신 얹어 둔 조각들.
        //
        // 표정 그룹(ALL_*)은 눈·눈썹·입이 한 덩어리라 입만 뺄 수 없다.
        // 그래서 말할 때는 그룹을 끄고 눈·눈썹 조각을 직접 얹는다.
        // 여기 적어 두었다가 다음 번에 지운다.
        const speakMorphs = new Set();

        function isSpeaking() {
            return !!lipSyncTimer;
        }

        function applyExpression(expression) {
            if (!currentVRM || !currentVRM.blendShapeProxy) return;

            // 부정적인 표현이 사라지는 단계면 여기서 갈아 끼운다.
            expression = swapNegative('expressions', expression);

            try {
                // 절정 표정은 표현용 얼굴에서 짓는다. 그때 얼굴을 바꿔 낀다.
                const spec = ENTITY && ENTITY.expressions
                    && ENTITY.expressions.find(x => x.key === expression);
                const special = !!(spec && spec.source === 'special')
                    && !!bodyVRM;

                useSpecialFace(special);

                const proxy = (special && bodyVRM)
                    ? bodyVRM.blendShapeProxy
                    : currentVRM.blendShapeProxy;

                if (!proxy) return;
                currentExpression = expression;
                isExpressing = expression !== 'neutral';

                // 지울 이름은 개체가 알려준 목록을 쓴다.
                const clearNames = ENTITY_SHAPES.length
                    ? ENTITY_SHAPES
                    : ['joy', 'angry', 'sorrow', 'fun',
                       'surprised', 'blink', 'blink_l', 'blink_r'];

                clearNames.forEach(name => {
                    try { proxy.setValue(name, 0.0); } catch (e) {}
                });

                if (surprisedBlendShapeName) {
                    try { proxy.setValue(surprisedBlendShapeName, 0.0); } catch (e) {}
                }

                // 말하는 동안에는 입을 립싱크에 넘긴다.
                //
                // 웃는 입이 벌어져 있는데 그 위에 '아' 가 얹히면 입이
                // 두 겹으로 일그러진다. 평온할 때 말하는 입이 가장
                // 자연스러운 것도 그래서다 — 겹칠 입이 없기 때문이다.
                //
                // 그래서 말할 때는 표정 그룹을 끄고 눈·눈썹 조각만 얹는다.
                const talking = isSpeaking();
                const SP = (ENTITY && ENTITY.behavior
                    && ENTITY.behavior.speaking) || {};
                const toParts = SP.group_to_parts || {};
                const mouthPre = SP.mouth_prefixes || ['Fcl_MTH_', 'Fcl_HA_'];

                // 지난번에 얹어 둔 조각을 먼저 걷는다
                speakMorphs.forEach(n => setMorph(n, 0));
                speakMorphs.clear();

                // 표정 수치는 이 파일이 정하지 않는다. 개체가 정한다.
                const shapes = entityShapesFor(expression) || {};
                Object.keys(shapes).forEach(name => {
                    const parts = talking ? toParts[name] : null;

                    if (parts) {
                        // 입을 뺀 채로 눈과 눈썹만
                        parts.forEach(n => {
                            setMorph(n, shapes[name]);
                            speakMorphs.add(n);
                        });
                        return;
                    }

                    try { proxy.setValue(name, shapes[name]); } catch (e) {}
                });

                // 부위별 모프도 개체가 정한 대로 얹는다
                clearMorphs();
                const morphs = entityMorphsFor(expression) || {};
                Object.keys(morphs).forEach(n => {
                    // 말하는 중이면 입을 건드리는 조각은 빼둔다
                    if (talking && mouthPre.some(p => n.indexOf(p) === 0)) return;
                    setMorph(n, morphs[n]);
                });

                // 단계에 붙어 있는 얼굴은 표정과 상관없이 늘 걸린다.
                // 얀데레의 빈 눈이 그것이다 — 웃어도 눈에 빛이 없다.
                const sm = stageMorphs();
                Object.keys(sm).forEach(n => setMorph(n, sm[n]));

                if (!Object.keys(shapes).length
                    && !Object.keys(morphs).length) {
                    isExpressing = false;
                }

                // 표정이 눈 자체를 쓰는 것이면 눈을 뜨게 하면 안 된다.
                // 눈 감기·윙크가 blink 값을 쓰는데 여기서 0으로 되돌리면
                // 감으라고 해 놓고 곧바로 뜨는 꼴이 된다.
                const usesEyes = Object.keys(shapes)
                    .some(n => String(n).indexOf('blink') === 0);

                if (expression !== 'neutral' && !usesEyes) {
                    isBlinking = false;
                    blinkProgress = 0;
                    blinkTimer = 0;
                    setEyeState(false);
                }

                if (usesEyes) {
                    // 감고 있는 동안 저절로 깜빡이면 값이 흔들린다
                    isBlinking = false;
                    blinkProgress = 0;
                    blinkTimer = 0;
                }

                // 자는 중이면 눈은 감은 채로 둔다.
                // 위에서 지우는 목록에 blink 가 들어 있어서,
                // 그냥 두면 표정을 건드릴 때마다 눈이 떠진다.
                if (isSleeping) {
                    isBlinking = false;
                    blinkProgress = 0;
                    setEyeState(true);
                }

                proxy.update();

                // 지금 기분을 화면 오른쪽 위에도 알린다
                if (typeof setMood === 'function') setMood(expression);

            } catch (e) {
                console.log('표정 적용 실패:', e);
            }
        }



        // ============================================================
        // 한국어 텍스트 → 립싱크 모음
        // ============================================================

        function textToVisemes(text) {

            const visemes = [];

            for (
                let i = 0;
                i < text.length;
                i++
            ) {

                const char = text[i];

                const code =
                    char.charCodeAt(0);


                // 한글
                if (
                    code >= 0xAC00 &&
                    code <= 0xD7A3
                ) {

                    const vowelIndex =
                        Math.floor(
                            ((code - 0xAC00) % 588) / 28
                        );


                    if (
                        [0, 1, 2, 3, 9]
                            .includes(vowelIndex)
                    ) {

                        visemes.push('a');

                    } else if (
                        [4, 5, 6, 7, 14, 15]
                            .includes(vowelIndex)
                    ) {

                        visemes.push('e');

                    } else if (
                        [8, 12, 13]
                            .includes(vowelIndex)
                    ) {

                        visemes.push('o');

                    } else if (
                        [11, 16, 17, 18, 19]
                            .includes(vowelIndex)
                    ) {

                        visemes.push('u');

                    } else {

                        visemes.push('i');

                    }

                }

                // 영어
                else if (/[aA]/.test(char)) {

                    visemes.push('a');

                } else if (/[iI]/.test(char)) {

                    visemes.push('i');

                } else if (/[uU]/.test(char)) {

                    visemes.push('u');

                } else if (/[eE]/.test(char)) {

                    visemes.push('e');

                } else if (/[oO]/.test(char)) {

                    visemes.push('o');

                }

                // 공백 / 문장부호
                else if (
                    char === ' ' ||
                    char === '.' ||
                    char === ',' ||
                    char === '!' ||
                    char === '?' ||
                    char === '。' ||
                    char === '！' ||
                    char === '？'
                ) {

                    visemes.push(null);
                }
            }

            return visemes;
        }


        // ============================================================
        // 목표 입 모양 초기화
        // ============================================================

        function resetTargetVowels() {

            Object.keys(
                targetVowelValues
            ).forEach(v => {

                targetVowelValues[v] = 0;

            });
        }


        // ============================================================
        // 립싱크
        // ============================================================

                        // ------------------------------------------------------------
        // 말하는 도중 얼굴이 바뀌는 자리
        //
        // 예전에는 이모지 목록을 이 파일에 손으로 적어 두고 글자 하나와
        // 맞춰 봤다. 그래서 '좋아' 'ㅋㅋ' '슬퍼' 처럼 두 글자 이상인 신호는
        // 한 번도 걸린 적이 없었다 — 글자 하나와 같을 수가 없기 때문이다.
        // 목록도 개체와 따로 놀아서 한쪽만 고치면 어긋났다.
        //
        // 이제 지나온 글자를 조금 쥐고 있다가, 개체가 들고 있는
        // live_triggers 로 끝나는지 본다. 여러 글자짜리도 걸린다.
        // ------------------------------------------------------------

        let spokenTail = '';

        function liveTrigger(ch) {
            spokenTail = (spokenTail + ch).slice(-10);

            const list = (ENTITY && ENTITY.expressions) || [];

            for (const e of list) {
                if (e.key === 'neutral' || !e.live_triggers) continue;

                const hit = e.live_triggers.some(t => t && spokenTail.endsWith(t));
                if (!hit) continue;

                if (window.expressionChangeTimer) {
                    clearTimeout(window.expressionChangeTimer);
                }

                applyExpression(e.key);
                spokenTail = '';        // 같은 신호가 두 번 걸리지 않게

                const ms = e.hold_ms || 3000;
                window.expressionChangeTimer = setTimeout(() => {
                    applyExpression('neutral');
                }, ms);

                return e.key;
            }

            return null;
        }


        // ============================================================
        // 목소리
        //
        // 소리를 어디서 만들지는 서버가 정한다.
        //   browser — 브라우저에 들어 있는 한국어 목소리로 여기서 읽는다
        //   gemini  — 서버가 만든 소리를 받아 튼다 (아케르나르)
        //
        // 어느 쪽이든 입 모양은 '실제로 소리가 나는 길이'에 맞춘다.
        // 예전에는 글자당 0.1초로 고정이라, 소리가 끝났는데 입만 계속
        // 움직이거나 그 반대가 되는 일이 있었다.
        // ============================================================

        const voice = {
            on: true,
            provider: 'browser',
            lang: 'ko-KR',
            rate: 1.0,
            pitch: 1.05,
            pick: null,          // 브라우저 목소리 하나
            audio: null,         // 지금 나고 있는 소리
            // 한 글자를 읽는 데 실제로 걸리는 시간(ms).
            // 첫 문장을 말해 보고 재서 채운다. 그전에는 0 이다.
            msPerChar: 0,
        };

        async function loadVoice() {
            try {
                const d = await fetch('/api/tts/config').then(r => r.json());
                voice.on = d.enabled !== false;
                voice.provider = d.provider || 'browser';
                voice.lang = d.lang || 'ko-KR';
                voice.rate = d.rate || 1.0;
                voice.pitch = d.pitch || 1.05;

                pickBrowserVoice();
                console.log('[diamondAI] 목소리: ' + voice.provider
                    + (voice.pick ? ' · ' + voice.pick.name : ''));
            } catch (e) {
                console.warn('[diamondAI] 목소리 설정을 못 불러왔다', e);
            }
        }

        function pickBrowserVoice() {
            if (!window.speechSynthesis) return;

            const all = speechSynthesis.getVoices();
            if (!all.length) return;      // 아직 안 불려왔다. onvoiceschanged 가 다시 부른다

            const ko = all.filter(v => (v.lang || '').toLowerCase().startsWith('ko'));

            // 한국어 중에서도 여성 목소리를 앞에 둔다
            const want = ['heami', 'sunhi', 'yuna', 'female', '여성'];
            ko.sort((a, b) => {
                const sa = want.findIndex(w => (a.name || '').toLowerCase().includes(w));
                const sb = want.findIndex(w => (b.name || '').toLowerCase().includes(w));
                return (sa < 0 ? 9 : sa) - (sb < 0 ? 9 : sb);
            });

            voice.pick = ko[0] || null;
        }

        if (window.speechSynthesis) {
            speechSynthesis.onvoiceschanged = pickBrowserVoice;
        }

        function stopVoice() {
            if (voice.audio) {
                try { voice.audio.pause(); } catch (e) {}
                voice.audio = null;
            }
            if (window.speechSynthesis) {
                try { speechSynthesis.cancel(); } catch (e) {}
            }
        }

        // 소리를 내고, 그 길이를 알려준다.
        //
        // 길이를 알면 입 모양을 거기에 맞출 수 있다. 못 알아내면
        // 0 을 돌려주고, 그때는 글자 수로 어림잡은 값을 그대로 쓴다.
        async function speak(text) {
            if (!voice.on || !text) return 0;

            stopVoice();

            // 서버가 만들어 주는 목소리면 받아서 튼다.
            //
            // edge 는 mp3 를 그대로 주므로 바로 틀 수 있고,
            // gemini 는 헤더 없는 PCM 이라 wav 로 싸야 한다.
            if (voice.provider !== 'browser') {
                try {
                    const d = await fetch('/api/tts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text }),
                    }).then(r => r.json());

                    if (d.ok && d.audio) {
                        const mime = d.mime || '';
                        const src = mime.indexOf('L16') >= 0
                            ? pcmToWav(d.audio, mime)
                            : 'data:' + (mime || 'audio/mpeg')
                              + ';base64,' + d.audio;

                        const a = new Audio(src);
                        voice.audio = a;

                        // 소리 길이를 알아야 입을 맞출 수 있다.
                        // 다 읽히기를 기다렸다가 튼다 — 그래야 길이가 나온다.
                        const ms = await new Promise(res => {
                            a.onloadedmetadata = () => {
                                res(isFinite(a.duration) ? a.duration * 1000 : 0);
                            };
                            a.onerror = () => res(0);
                            setTimeout(() => res(0), 1500);
                        });

                        a.play().catch(() => {});
                        return ms;
                    }
                } catch (e) {
                    console.warn('[diamondAI] 서버 목소리 실패, 브라우저로', e);
                }
            }

            // 브라우저 목소리
            if (!window.speechSynthesis) return 0;

            const u = new SpeechSynthesisUtterance(text);
            u.lang = voice.lang;
            u.rate = voice.rate;
            u.pitch = voice.pitch;
            if (voice.pick) u.voice = voice.pick;

            // 브라우저는 소리 길이를 미리 안 알려준다.
            //
            // 그래서 실제로 걸린 시간을 재 두었다가 다음 문장에 쓴다.
            // 목소리와 말 속도에 따라 저절로 맞춰진다.
            let began = 0;
            u.onstart = () => { began = performance.now(); };
            u.onend = () => {
                if (!began) return;
                const took = performance.now() - began;
                const n = Math.max(1, Array.from(text).length);
                const each = took / n;

                // 한 번 튄 값에 휘둘리지 않게 조금씩만 옮긴다
                voice.msPerChar = voice.msPerChar
                    ? voice.msPerChar * 0.7 + each * 0.3
                    : each;

                console.log('[diamondAI] 말 속도 실측 '
                    + each.toFixed(0) + 'ms/자 · 평균 '
                    + voice.msPerChar.toFixed(0) + 'ms/자');
            };

            speechSynthesis.speak(u);

            // 지금까지 재 둔 속도가 있으면 그걸로 어림잡는다
            return voice.msPerChar
                ? voice.msPerChar * Array.from(text).length
                : 0;
        }

        // Gemini 는 헤더 없는 PCM 을 준다. 그대로는 못 트니 wav 로 싼다.
        function pcmToWav(b64, mime) {
            const rateHit = /rate=(\d+)/.exec(mime || '');
            const rate = rateHit ? parseInt(rateHit[1], 10) : 24000;

            const raw = atob(b64);
            const pcm = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) pcm[i] = raw.charCodeAt(i);

            const buf = new ArrayBuffer(44 + pcm.length);
            const view = new DataView(buf);
            const put = (o, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(o + i, str.charCodeAt(i));
            };

            put(0, 'RIFF');
            view.setUint32(4, 36 + pcm.length, true);
            put(8, 'WAVE');
            put(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);        // PCM
            view.setUint16(22, 1, true);        // 모노
            view.setUint32(24, rate, true);
            view.setUint32(28, rate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            put(36, 'data');
            view.setUint32(40, pcm.length, true);
            new Uint8Array(buf, 44).set(pcm);

            const blob = new Blob([buf], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        }


        function playLipSync(text, voiceMs) {
            voiceMs = voiceMs || 0;

            lipSyncQueue =
                textToVisemes(text);


            if (lipSyncTimer) {

                clearInterval(
                    lipSyncTimer
                );

                lipSyncTimer = null;
            }


            if (
                lipSyncQueue.length === 0
            ) {

                resetTargetVowels();

                return;
            }


            // 🚀 실시간으로 문장을 읽으며 표정을 동적으로 바꾸기 위해 원본 대사의 글자 배열을 만듭니다.
            const textChars = Array.from(text);


            /*
             * 표정이 입을 살짝 벌리고 있는 경우에도
             * 립싱크가 그 위에 추가되면서 입이 과하게
             * 벌어지는 문제를 줄이기 위해 강도를 낮춘다.
             */

            // 입이 움직이는 속도.
            //
            // 기본은 글자당 0.1초다. 다만 실제로 나는 소리의 길이를
            // 알아냈다면 그쪽에 맞춘다 — 소리는 끝났는데 입만 움직이거나
            // 그 반대가 되지 않도록.
            let tick = (ENTITY && ENTITY.behavior
                && ENTITY.behavior.lipsync_tick_ms) || 100;

            if (voiceMs > 0 && lipSyncQueue.length > 0) {
                tick = Math.max(40, Math.min(260, voiceMs / lipSyncQueue.length));
            }

            // 말이 시작됐으니 입을 립싱크에 넘긴다.
            // 표정을 다시 걸면 눈·눈썹만 남고 입이 비워진다.
            const wasFace = currentExpression;
            setTimeout(() => {
                if (wasFace && isSpeaking()) applyExpression(wasFace);
            }, 0);

            lipSyncTimer = setInterval(() => {

                if (
                    lipSyncQueue.length === 0 ||
                    isSleeping
                ) {

                    clearInterval(
                        lipSyncTimer
                    );

                    lipSyncTimer = null;

                    resetTargetVowels();

                    return;
                }


                // 다이아가 입을 뻐끔거리며 지나가는 찰나의 '현재 글자'를 하나 가로챕니다.
                const currentChar = textChars.shift();


                if (currentChar) {
                    liveTrigger(currentChar);
                }


                const viseme =
                    lipSyncQueue.shift();


                resetTargetVowels();


                if (
                    viseme &&
                    Object.prototype.hasOwnProperty.call(
                        targetVowelValues,
                        viseme
                    )
                ) {

                    /*
                     * 표정이 웃는 상태일 때
                     * 입이 이미 어느 정도 열려 있을 수 있으므로
                     * 일반적인 립싱크보다 조금 약하게 한다.
                     */

                    // 입이 얼마나 벌어질지. 개체가 정한다.
                    //
                    // 예전에는 0.16~0.24 로 박아 두었는데, 그 정도면 입꼬리가
                    // 0.4mm 움직여서 말하는지 아닌지 티가 안 났다.
                    const L = (ENTITY && ENTITY.behavior
                        && ENTITY.behavior.lipsync) || {};

                    let baseAmount = (currentExpression === 'neutral')
                        ? (L.amount || 0.9)
                        : (L.amount_expressing || 0.6);

                    // 말하느라 벌어지는 폭은 즐거움 표정의 입 폭을 넘지 않는다.
                    //
                    // 재는 것은 '말 때문에 벌어진 몫' 이다. 표정이 이미

                    // 되어 입이 아예 안 움직인다.
                    const per = (L.width_per_unit || {})[viseme] || 0;
                    const cap = (L.width_expression || {})[L.cap_expression] || 0;

                    if (per > 0 && cap > 0) {
                        baseAmount = Math.min(baseAmount, cap / per);
                    }

                    targetVowelValues[viseme] =
                        baseAmount +
                        Math.random() * 0.025;
                }

            }, tick);

                        10.0 * deltaTime;

                        'i',
                        'u',

                        'o'
                    ].forEach(v => {

                        currentVowelValues[v] +=

                            Math.min(
                                lerpSpeed,
                                1.0
                            );

                            const presetName =
                                (
                                    THREE.VRMBlendShapePresetName &&
                                    THREE.VRMBlendShapePresetName[
                                        v.toUpperCase()
                                    ]
                                )
                                    ? THREE.VRMBlendShapePresetName[
                                        v.toUpperCase()
                                    ]
                                    : v;


                            currentVRM
                                .blendShapeProxy
                                .setValue(
                                    presetName,
                                    currentVowelValues[v]
                                );

                        } catch (e) {}

                    });


                    currentVRM
                        .blendShapeProxy
                        .update();
                }


                if (!isSleeping) {


                    // ------------------------------------------------
                    // 머리 움직임
                    // ------------------------------------------------

                    try {

                        const head =
                            currentVRM.humanoid
                                .getBoneNode(
                                    'head'
                                );


                        if (head) {

                            head.rotation.x =
                                poseHeadX +
                                Math.sin(
                                    clock.getElapsedTime() *
                                    2.0
                                ) *
                                0.02;
                        }

                    } catch (e) {}


                    // ------------------------------------------------
                    // 자동 눈 깜빡임
                    // 표정 중에는 완전히 정지
                    // ------------------------------------------------

                    if (!isExpressing) {

                        blinkTimer +=
                            deltaTime;


                        if (
                            !isBlinking &&
                            blinkTimer >=
                            blinkInterval
                        ) {

                            isBlinking = true;

                            blinkTimer = 0;

                            blinkProgress = 0;
                        }


                        if (isBlinking) {

                            blinkProgress +=
                                deltaTime * 4;


                            let blinkValue = 0;


                            if (
                                blinkProgress < 1.0
                            ) {

                                blinkValue =
                                    blinkProgress;

                            } else if (
                                blinkProgress < 2.0
                            ) {

                                blinkValue =
                                    2.0 -
                                    blinkProgress;

                            } else {

                                blinkValue = 0;

                                isBlinking = false;

                                blinkInterval =
                                    3 +
                                    Math.random() * 4;
                            }


                            try {

                                const blinkPreset =
                                    (
                                        THREE.VRMBlendShapePresetName &&
                                        THREE.VRMBlendShapePresetName.Blink

                                        ? THREE.VRMBlendShapePresetName.Blink

                                currentVRM
                                    .blendShapeProxy
                                    .setValue(
                                        blinkPreset,
                                        blinkValue
                                    );


                                currentVRM
                                    .blendShapeProxy
                                    .update();

                            } catch (e) {}
                        }
                    }
                }


                currentVRM.update(

                );

       // ============================================================

        const expressionNames = {

        // 개체의 이름 말고 사람들이 흔히 쓰는 말들.
